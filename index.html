<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>AS 접수 관리 대장</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #f3f4f6; }
  </style>
</head>
<body class="text-gray-800">
  <div id="app"></div>
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg z-50 transition-opacity duration-200 opacity-0 pointer-events-none"></div>

  <script>
    // ==========================================
    // [중요] 아래 두 번째 줄에 기존에 쓰던 eyJ... 암호를 붙여넣으세요!
    // ==========================================
    const SUPABASE_URL = "https://egntrwdxehqyyntjuczr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnbnRyd2R4ZWhxeXludGp1Y3pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1NzI2MjMsImV4cCI6MjExMTE0ODYyM30.DCeVvGoJ7m41FhNPH39dLzogrTsdq6QiAoRgsT7CgH0";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let state = {
      user: null,
      username: "",
      records: [],
      configs: [],
      search: "",
      statusFilter: "전체",
      sidoFilter: "전체",
      modelFilter: "전체",
      visitorFilter: "전체",
      sortKey: "receipt_date",
      sortDir: "desc",
      modalOpen: false,
      configModalOpen: false,
      pwModalOpen: false,
      exportModalOpen: false,
      editingRecord: null
    };

    const SYSTEM_KEYS = [
      "customer_name", "receipt_date", "status", "urgency", "visit_date",
      "region_sido", "region_sigun", "address_detail", "phone", "model_name",
      "symptom_category", "symptom_detail", "phone_action", "special_note",
      "receipt_channel", "serial_number", "completed_date", "visitor",
      "repair_note", "replaced_parts", "replacement_type", "dealer_name", "dealer_phone"
    ];

    const TEXTAREA_KEYS = ["symptom_detail", "phone_action", "special_note", "repair_note"];
    const DATE_KEYS = ["receipt_date", "visit_date", "completed_date"];
    const NUMBER_KEYS = ["repair_cost", "parts_cost", "total_cost"];
    const URGENCY_RANK = { "최긴급": 3, "긴급": 2, "일반": 1 };

    function showToast(msg) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.innerText = msg;
      t.classList.remove("opacity-0");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.add("opacity-0"), 2000);
    }

    async function copyText(text) {
      const clean = (text || "").replace(/\s+/g, " ").trim();
      if (!clean) return showToast("복사할 주소가 없습니다.");
      try {
        await navigator.clipboard.writeText(clean);
        showToast("📋 주소 복사 완료: " + clean);
      } catch (err) {
        const ta = document.createElement("textarea");
        ta.value = clean;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("📋 주소 복사 완료: " + clean);
      }
    }

    function copyModalAddress() {
      const form = document.getElementById("asRecordForm");
      if (!form) return;
      const sido = form.region_sido?.value || "";
      const sigun = form.region_sigun?.value || "";
      const detail = form.address_detail?.value || "";
      copyText(`${sido} ${sigun} ${detail}`);
    }

    function resetFilters() {
      state.search = "";
      state.statusFilter = "전체";
      state.sidoFilter = "전체";
      state.modelFilter = "전체";
      state.visitorFilter = "전체";
      state.sortKey = "receipt_date";
      state.sortDir = "desc";
      render();
    }

    function toggleSort(key) {
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      } else {
        state.sortKey = key;
        state.sortDir = (DATE_KEYS.includes(key) || NUMBER_KEYS.includes(key) || key === "urgency") ? "desc" : "asc";
      }
      render();
    }

    function setMobileSort(val) {
      const [key, dir] = val.split(":");
      state.sortKey = key;
      state.sortDir = dir;
      render();
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const { data: prof } = await sb.from("team_profiles").select("username").eq("user_id", session.user.id).single();
        state.user = session.user;
        state.username = prof ? prof.username : session.user.email.split("@")[0];
        await loadAllData();
      }
      render();
    }

    async function loadAllData() {
      const [recRes, cfgRes] = await Promise.all([
        sb.from("as_records").select("*").order("receipt_date", { ascending: false }).order("created_at", { ascending: false }),
        sb.from("field_configs").select("*").order("sort_order", { ascending: true })
      ]);
      state.records = recRes.data || [];
      state.configs = cfgRes.data || [];
    }

    async function handleLogin(e) {
      e.preventDefault();
      const nameInput = document.getElementById("loginName").value.trim();
      const pwInput = document.getElementById("loginPw").value;
      if (!nameInput || !pwInput) return alert("이름과 비밀번호를 입력하세요.");

      const { data: prof, error: profErr } = await sb.from("team_profiles").select("email").eq("username", nameInput).single();
      if (profErr || !prof) return alert("등록되지 않은 팀원 이름입니다.");

      const { data, error } = await sb.auth.signInWithPassword({ email: prof.email, password: pwInput });
      if (error) return alert("비밀번호가 일치하지 않습니다.");

      state.user = data.user;
      state.username = nameInput;
      await loadAllData();
      render();
    }

    async function handleLogout() {
      await sb.auth.signOut();
      state.user = null;
      state.username = "";
      render();
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      const newPw = document.getElementById("newPwInput").value;
      if (newPw.length < 6) return alert("비밀번호는 6자리 이상으로 입력하세요.");
      const { error } = await sb.auth.updateUser({ password: newPw });
      if (error) return alert("변경 실패: " + error.message);
      alert("비밀번호가 성공적으로 변경되었습니다!");
      state.pwModalOpen = false;
      render();
    }

    function openForm(record = null) {
      state.editingRecord = record;
      state.modalOpen = true;
      render();
    }

    async function saveRecord(e) {
      e.preventDefault();
      const f = e.target;
      const customFields = {};
      state.configs.filter(c => !c.is_system).forEach(c => {
        customFields[c.field_key] = f["custom_" + c.field_key]?.value || "";
      });

      const payload = {
        customer_name: f.customer_name?.value.trim() || "",
        receipt_date: f.receipt_date?.value || new Date().toISOString().slice(0,10),
        status: f.status?.value || "접수",
        urgency: f.urgency?.value || "일반",
        visit_date: f.visit_date?.value || null,
        region_sido: f.region_sido?.value || "",
        region_sigun: f.region_sigun?.value.trim() || "",
        address_detail: f.address_detail?.value.trim() || "",
        phone: f.phone?.value.trim() || "",
        model_name: f.model_name?.value.trim() || "",
        symptom_category: f.symptom_category?.value || "",
        symptom_detail: f.symptom_detail?.value.trim() || "",
        phone_action: f.phone_action?.value.trim() || "",
        special_note: f.special_note?.value.trim() || "",
        receipt_channel: f.receipt_channel?.value || "",
        serial_number: f.serial_number?.value.trim() || "",
        completed_date: f.completed_date?.value || null,
        visitor: f.visitor?.value.trim() || "",
        repair_note: f.repair_note?.value.trim() || "",
        replaced_parts: f.replaced_parts?.value.trim() || "",
        replacement_type: f.replacement_type?.value || "",
        dealer_name: f.dealer_name?.value.trim() || "",
        dealer_phone: f.dealer_phone?.value.trim() || "",
        payment_type: f.payment_type?.value || "현금",
        repair_cost: parseInt(f.repair_cost?.value || 0, 10),
        parts_cost: parseInt(f.parts_cost?.value || 0, 10),
        custom_fields: customFields,
        updated_by: state.username,
        updated_at: new Date().toISOString()
      };

      if (state.editingRecord) {
        const { error } = await sb.from("as_records").update(payload).eq("id", state.editingRecord.id);
        if (error) return alert("수정 오류: " + error.message);
      } else {
        payload.created_by = state.username;
        const { error } = await sb.from("as_records").insert([payload]);
        if (error) return alert("등록 오류: " + error.message);
      }

      state.modalOpen = false;
      state.editingRecord = null;
      await loadAllData();
      render();
    }

    async function deleteRecord(id) {
      if (!confirm("정말 이 AS 내역을 삭제할까요?")) return;
      await sb.from("as_records").delete().eq("id", id);
      state.modalOpen = false;
      await loadAllData();
      render();
    }

    async function addNewField(e) {
      e.preventDefault();
      const label = document.getElementById("newFieldLabel").value.trim();
      const type = document.getElementById("newFieldType").value;
      const optsRaw = document.getElementById("newFieldOpts").value.trim();
      if (!label) return alert("항목 이름을 입력하세요.");

      const key = "field_" + Date.now();
      const options = type === "select" ? optsRaw.split(",").map(s => s.trim()).filter(Boolean) : [];
      const { error } = await sb.from("field_configs").insert([{
        field_key: key, field_label: label, field_type: type, options, is_system: false, sort_order: state.configs.length + 1
      }]);
      if (error) return alert("항목 추가 오류: " + error.message);
      await loadAllData();
      render();
    }

    async function saveFieldConfig(id, key) {
      const typeEl = document.getElementById("type_" + id);
      const optsEl = document.getElementById("opt_" + id);
      let newType = typeEl ? typeEl.value : "text";
      if (newType !== "select") {
        if (DATE_KEYS.includes(key)) newType = "date";
        else if (TEXTAREA_KEYS.includes(key)) newType = "textarea";
        else newType = "text";
      }
      const options = newType === "select" && optsEl
        ? optsEl.value.split(",").map(s => s.trim()).filter(Boolean)
        : [];

      const { error } = await sb.from("field_configs").update({ field_type: newType, options }).eq("id", id);
      if (error) return alert("저장 오류: " + error.message);
      await loadAllData();
      alert("설정이 저장되었습니다.");
      render();
    }

    async function deleteCustomField(id) {
      if (!confirm("이 추가 항목을 삭제할까요?")) return;
      await sb.from("field_configs").delete().eq("id", id);
      await loadAllData();
      render();
    }

    function getFilteredRecords() {
      const filtered = state.records.filter(r => {
        if (state.statusFilter !== "전체" && r.status !== state.statusFilter) return false;
        if (state.sidoFilter !== "전체" && r.region_sido !== state.sidoFilter) return false;
        if (state.modelFilter !== "전체" && (r.model_name || "") !== state.modelFilter) return false;
        if (state.visitorFilter !== "전체" && (r.visitor || "") !== state.visitorFilter) return false;
        if (state.search) {
          const q = state.search.toLowerCase();
          const target = `${r.customer_name} ${r.phone} ${r.model_name} ${r.serial_number} ${r.dealer_name} ${r.visitor} ${r.region_sigun} ${r.address_detail} ${r.symptom_detail} ${r.created_by}`.toLowerCase();
          if (!target.includes(q)) return false;
        }
        return true;
      });

      const key = state.sortKey;
      const mult = state.sortDir === "asc" ? 1 : -1;

      return [...filtered].sort((a, b) => {
        if (NUMBER_KEYS.includes(key)) {
          return ((a[key] || 0) - (b[key] || 0)) * mult;
        }
        if (key === "urgency") {
          return ((URGENCY_RANK[a.urgency] || 1) - (URGENCY_RANK[b.urgency] || 1)) * mult;
        }
        if (key === "region_sido") {
          const va = `${a.region_sido || ""} ${a.region_sigun || ""}`.trim();
          const vb = `${b.region_sido || ""} ${b.region_sigun || ""}`.trim();
          if (!va && !vb) return 0;
          if (!va) return 1;
          if (!vb) return -1;
          return va.localeCompare(vb, "ko") * mult;
        }
        const va = String(a[key] ?? "").trim();
        const vb = String(b[key] ?? "").trim();
        if (!va && !vb) return 0;
        if (!va) return 1;
        if (!vb) return -1;
        return va.localeCompare(vb, "ko") * mult;
      });
    }

    function exportExcel(format) {
      const rows = getFilteredRecords();
      const sysCols = SYSTEM_KEYS.map(k => getCfg(k)).filter(Boolean);
      const customCols = state.configs.filter(c => !c.is_system);

      const headers = [
        ...sysCols.map(c => c.field_label),
        ...customCols.map(c => c.field_label),
        "수리비구분", "수리비", "부품비", "최종합계", "최초작성자", "최종수정자"
      ];

      const dataRows = rows.map(r => [
        ...sysCols.map(c => r[c.field_key] ?? ""),
        ...customCols.map(c => (r.custom_fields && r.custom_fields[c.field_key]) || ""),
        r.payment_type || "현금",
        r.repair_cost || 0,
        r.parts_cost || 0,
        r.total_cost || 0,
        r.created_by || "",
        r.updated_by || ""
      ]);

      const dateStr = new Date().toISOString().slice(0, 10);

      if (format === "xls" || format === "xlsx") {
        const ws = XLSX.utils.aoa_to_sheet([headers, ...dataRows]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "AS접수대장");

        if (format === "xls") {
          XLSX.writeFile(wb, `AS접수대장_${dateStr}.xls`, { bookType: "biff8" });
        } else {
          XLSX.writeFile(wb, `AS접수대장_${dateStr}.xlsx`, { bookType: "xlsx" });
        }
      } else {
        const csvLines = [
          headers.join(","),
          ...dataRows.map(row => row.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(","))
        ];
        const blob = new Blob(["\uFEFF" + csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `AS접수대장_${dateStr}.csv`;
        a.click();
      }

      state.exportModalOpen = false;
      render();
      showToast(`📥 ${format.toUpperCase()} 파일 다운로드 완료`);
    }

    function statusBadge(st) {
      const map = {
        "접수": "bg-red-100 text-red-700",
        "처리중": "bg-blue-100 text-blue-700",
        "대기중": "bg-yellow-100 text-yellow-800",
        "처리완료": "bg-green-100 text-green-700",
        "보류": "bg-gray-200 text-gray-700"
      };
      return map[st] || "bg-purple-100 text-purple-700";
    }

    function urgencyBadge(ug) {
      if (ug === "최긴급") return "bg-red-600 text-white";
      if (ug === "긴급") return "bg-orange-100 text-orange-700";
      return "bg-gray-100 text-gray-600";
    }

    function paymentBadge(pt) {
      if (pt === "세금계산서") return "bg-indigo-100 text-indigo-700";
      if (pt === "무상") return "bg-gray-200 text-gray-700";
      return "bg-emerald-100 text-emerald-700";
    }

    function calculateTotal(payType, repair, parts) {
      const sum = (repair || 0) + (parts || 0);
      if (payType === "세금계산서") return Math.round(sum * 1.1);
      if (payType === "무상") return 0;
      return sum;
    }

    function calcModalTotal() {
      const payType = document.getElementById("inpPaymentType")?.value || "현금";
      const r = parseInt(document.getElementById("inpRepairCost")?.value || 0, 10);
      const p = parseInt(document.getElementById("inpPartsCost")?.value || 0, 10);
      const total = calculateTotal(payType, r, p);
      const el = document.getElementById("modalTotalDisplay");
      const subEl = document.getElementById("modalSubDisplay");
      if (el) el.innerText = total.toLocaleString() + "원";
      if (subEl) {
        if (payType === "세금계산서") {
          const vat = total - (r + p);
          subEl.innerText = `(공급가 ${(r+p).toLocaleString()}원 + 부가세 ${vat.toLocaleString()}원)`;
        } else if (payType === "무상") {
          subEl.innerText = `(내부 발생비용 ${(r+p).toLocaleString()}원 / 청구 0원)`;
        } else {
          subEl.innerText = `(수리비 + 부품비)`;
        }
      }
    }

    function getCfg(key) {
      return state.configs.find(c => c.field_key === key);
    }

    function renderSortTh(key, label, alignRight = false) {
      const active = state.sortKey === key;
      const icon = active
        ? (state.sortDir === "asc" ? `<span class="text-blue-600 ml-1">▲</span>` : `<span class="text-blue-600 ml-1">▼</span>`)
        : `<span class="text-gray-300 ml-1">⇅</span>`;
      return `
        <th onclick="toggleSort('${key}')" class="p-3 cursor-pointer select-none hover:bg-gray-100 transition ${alignRight ? "text-right" : ""} ${active ? "text-blue-700 bg-blue-50/50" : ""}">
          ${label}${icon}
        </th>`;
    }

    function render() {
      const app = document.getElementById("app");
      if (!state.user) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <form onsubmit="handleLogin(event)" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm space-y-5">
              <div class="text-center">
                <h1 class="text-2xl font-bold text-gray-900">AS 접수 대장</h1>
                <p class="text-sm text-gray-500 mt-1">팀원 이름으로 로그인하세요</p>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">아이디 (팀원 이름)</label>
                <input id="loginName" type="text" placeholder="예: 박종민" class="w-full border rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">비밀번호</label>
                <input id="loginPw" type="password" placeholder="비밀번호 입력" class="w-full border rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
              </div>
              <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700">로그인</button>
            </form>
          </div>`;
        return;
      }

      const filtered = getFilteredRecords();
      const statusOpts = getCfg("status")?.options || ["접수","처리중","대기중","처리완료","보류"];
      const sidoOpts = getCfg("region_sido")?.options || ["서울","경기","인천","강원","충북","충남","대전","세종","전북","전남","광주","경북","경남","대구","울산","부산","제주"];

      const modelSet = new Set([
        ...(getCfg("model_name")?.options || []),
        ...state.records.map(r => (r.model_name || "").trim()).filter(Boolean)
      ]);
      const modelOpts = Array.from(modelSet);

      const visitorSet = new Set([
        ...(getCfg("visitor")?.options || []),
        ...state.records.map(r => (r.visitor || "").trim()).filter(Boolean)
      ]);
      const visitorOpts = Array.from(visitorSet);

      const hasActiveFilter = state.search || state.statusFilter !== "전체" || state.sidoFilter !== "전체" || state.modelFilter !== "전체" || state.visitorFilter !== "전체" || state.sortKey !== "receipt_date" || state.sortDir !== "desc";
      const currentSortVal = `${state.sortKey}:${state.sortDir}`;

      app.innerHTML = `
        <!-- 상단 바 -->
        <header class="bg-white border-b sticky top-0 z-20">
          <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="font-bold text-lg text-blue-600">AS 접수 대장</span>
              <span class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-full font-medium">${state.username}님</span>
            </div>
            <div class="flex items-center gap-2 text-sm">
              <button onclick="state.configModalOpen=true;render()" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium">⚙️ 항목관리</button>
              <button onclick="state.exportModalOpen=true;render()" class="px-3 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg font-medium">📥 엑셀다운</button>
              <button onclick="state.pwModalOpen=true;render()" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg">비번변경</button>
              <button onclick="handleLogout()" class="px-3 py-1.5 text-gray-500 hover:text-red-600">로그아웃</button>

                  <div>🔧 <b>${r.model_name || "모델미입력"}</b> ${r.serial_number ? `(${r.serial_number})` : ""} · ${r.symptom_category || ""}</div>

    function renderDynamicInput(cfg, val, isRequired = false) {
      const nameAttr = cfg.is_system ? cfg.field_key : `custom_${cfg.field_key}`;
      const reqAttr = isRequired ? "required" : "";
      const fullSpan = (cfg.field_key === "address_detail" || cfg.field_type === "textarea") ? "col-span-2" : "";

      let inputHtml = "";
      if (cfg.field_type === "select") {
        const opts = cfg.options || [];
        inputHtml = `
          <select name="${nameAttr}" ${reqAttr} class="w-full border rounded-lg px-3 py-2 bg-white">
            <option value="">선택</option>
            ${opts.map(o => `<option value="${o}" ${val === o ? "selected" : ""}>${o}</option>`).join("")}
            ${val && !opts.includes(val) ? `<option value="${val}" selected>${val}</option>` : ""}
          </select>`;
      } else if (cfg.field_type === "date" || DATE_KEYS.includes(cfg.field_key)) {
        inputHtml = `<input type="date" name="${nameAttr}" value="${val}" ${reqAttr} class="w-full border rounded-lg px-3 py-2" />`;
      } else if (cfg.field_type === "textarea" || TEXTAREA_KEYS.includes(cfg.field_key)) {
        inputHtml = `<textarea name="${nameAttr}" rows="2" ${reqAttr} class="w-full border rounded-lg px-3 py-2">${val}</textarea>`;
      } else {
        inputHtml = `<input type="text" name="${nameAttr}" value="${val}" ${reqAttr} class="w-full border rounded-lg px-3 py-2" />`;
      }

      const copyBtn = cfg.field_key === "address_detail"
        ? `<button type="button" onclick="copyModalAddress()" class="text-xs bg-gray-100 hover:bg-blue-50 text-blue-600 border border-gray-200 px-2 py-0.5 rounded font-semibold">📋 전체주소 복사</button>`
        : "";

      return `
        <div class="${fullSpan}">
          <div class="flex justify-between items-center mb-1">
            <label class="block font-medium">${cfg.field_label}${isRequired ? " *" : ""}</label>
            ${copyBtn}
          </div>
          ${inputHtml}
        </div>`;
    }

    function renderFormModal() {
      const r = state.editingRecord || {};
      const today = new Date().toISOString().slice(0, 10);

      const sysCols = SYSTEM_KEYS.map(k => getCfg(k)).filter(Boolean);
      const customCols = state.configs.filter(c => !c.is_system);

      const payType = r.payment_type || "현금";
      const repair = r.repair_cost || 0;
      const parts = r.parts_cost || 0;
      const total = calculateTotal(payType, repair, parts);

      let subText = "(수리비 + 부품비)";
      if (payType === "세금계산서") subText = `(공급가 ${(repair+parts).toLocaleString()}원 + 부가세 ${(total-(repair+parts)).toLocaleString()}원)`;
      if (payType === "무상") subText = `(내부 발생비용 ${(r.repair_cost+r.parts_cost || 0).toLocaleString()}원 / 청구 0원)`;

      return `
        <div class="fixed inset-0 bg-black/50 flex items-end md:items-center justify-center z-40 overflow-y-auto">
          <form id="asRecordForm" onsubmit="saveRecord(event)" class="bg-white w-full max-w-2xl rounded-t-2xl md:rounded-2xl p-5 max-h-[92vh] overflow-y-auto space-y-4">
            <div class="flex justify-between items-center border-b pb-3 sticky top-0 bg-white z-10">
              <h2 class="font-bold text-lg">${r.id ? "AS 내역 상세 / 수정" : "새 AS 접수 등록"}</h2>
              <button type="button" onclick="state.modalOpen=false;render()" class="text-gray-400 text-2xl leading-none">&times;</button>
            </div>

            ${r.id ? `<div class="text-xs bg-gray-100 p-2 rounded text-gray-600">최초 작성: <b>${r.created_by}</b> (${r.created_at?.slice(0,16).replace("T"," ")}) / 최종 수정: <b>${r.updated_by || "-"}</b></div>` : ""}

            <div class="grid grid-cols-2 gap-3 text-sm">
              ${sysCols.map(c => {
                let val = r[c.field_key] ?? "";
                if (!r.id && c.field_key === "receipt_date") val = today;
                if (!r.id && c.field_key === "status") val = "접수";
                if (!r.id && c.field_key === "urgency") val = "일반";
                if (!r.id && c.field_key === "receipt_channel") val = "전화";
                if (!r.id && c.field_key === "replacement_type") val = "해당없음";
                return renderDynamicInput(c, val, c.field_key === "customer_name");
              }).join("")}
            </div>

            ${customCols.length > 0 ? `
              <div class="border-t pt-3 grid grid-cols-2 gap-3 text-sm">
                ${customCols.map(c => {
                  const val = (r.custom_fields && r.custom_fields[c.field_key]) || "";
                  return renderDynamicInput(c, val, false);
                }).join("")}
              </div>` : ""}

            <div class="bg-blue-50 p-3.5 rounded-xl space-y-3 text-sm">
              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="block font-bold text-xs text-blue-900 mb-1">수리비 구분</label>
                  <select id="inpPaymentType" name="payment_type" onchange="calcModalTotal()" class="w-full border border-blue-200 rounded-lg px-2 py-2 bg-white font-semibold">
                    <option value="현금" ${payType==="현금"?"selected":""}>현금</option>
                    <option value="세금계산서" ${payType==="세금계산서"?"selected":""}>세금계산서</option>
                    <option value="무상" ${payType==="무상"?"selected":""}>무상</option>
                  </select>
                </div>
                <div>
                  <label class="block font-medium text-xs mb-1">수리비 (원)</label>
                  <input id="inpRepairCost" type="number" name="repair_cost" value="${repair}" oninput="calcModalTotal()" class="w-full border rounded-lg px-2.5 py-2 bg-white" />
                </div>
                <div>
                  <label class="block font-medium text-xs mb-1">부품비 (원)</label>
                  <input id="inpPartsCost" type="number" name="parts_cost" value="${parts}" oninput="calcModalTotal()" class="w-full border rounded-lg px-2.5 py-2 bg-white" />
                </div>
              </div>
              <div class="flex justify-between items-center border-t border-blue-200 pt-2">
                <span id="modalSubDisplay" class="text-xs text-blue-800">${subText}</span>
                <div class="text-right">
                  <span class="text-xs text-gray-600 mr-1">최종 합계</span>
                  <span id="modalTotalDisplay" class="font-bold text-lg text-blue-700">${total.toLocaleString()}원</span>
                </div>
              </div>
            </div>

            <div class="flex justify-between pt-3 border-t">
              ${r.id ? `<button type="button" onclick="deleteRecord('${r.id}')" class="px-4 py-2.5 text-red-600 bg-red-50 rounded-lg text-sm font-medium">삭제</button>` : `<div></div>`}
              <div class="flex gap-2">
                <button type="button" onclick="state.modalOpen=false;render()" class="px-4 py-2.5 bg-gray-100 rounded-lg text-sm">취소</button>
                <button type="submit" class="px-6 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-bold">저장하기</button>
              </div>
            </div>
          </form>
        </div>`;
    }

    function renderConfigModal() {
      const sysCols = SYSTEM_KEYS.map(k => getCfg(k)).filter(Boolean);
      const customCols = state.configs.filter(c => !c.is_system);

      const renderConfigRow = (c) => {
        const isSelect = c.field_type === "select";
        const isDate = c.field_type === "date" || DATE_KEYS.includes(c.field_key);
        return `
          <div class="bg-gray-50 p-3 rounded-lg space-y-2 border">
            <div class="flex justify-between items-center gap-2">
              <div class="font-bold text-gray-800">${c.field_label}</div>
              <div class="flex items-center gap-1.5">
                ${!isDate ? `
                  <select id="type_${c.id}" onchange="document.getElementById('optwrap_${c.id}').style.display=this.value==='select'?'block':'none'" class="border rounded px-2 py-1 text-xs bg-white">
                    <option value="text" ${!isSelect ? "selected" : ""}>직접 입력(텍스트)</option>
                    <option value="select" ${isSelect ? "selected" : ""}>선택형(드롭다운)</option>
                  </select>
                  <button onclick="saveFieldConfig('${c.id}', '${c.field_key}')" class="px-2.5 py-1 bg-blue-600 text-white rounded text-xs font-semibold">적용</button>
                ` : `<span class="text-xs text-gray-400">날짜 입력형</span>`}
                ${!c.is_system ? `<button onclick="deleteCustomField('${c.id}')" class="px-2 py-1 bg-red-50 text-red-600 rounded text-xs">삭제</button>` : ""}
              </div>
            </div>
            <div id="optwrap_${c.id}" style="display:${isSelect ? "block" : "none"}">
              <input id="opt_${c.id}" value="${(c.options || []).join(", ")}" placeholder="선택 항목을 쉼표(,)로 구분해 입력" class="w-full border rounded px-2.5 py-1.5 text-xs bg-white" />
            </div>
          </div>`;
      };

      return `
        <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
          <div class="bg-white rounded-2xl p-5 w-full max-w-xl max-h-[90vh] overflow-y-auto space-y-5 text-sm">
            <div class="flex justify-between items-center border-b pb-2 sticky top-0 bg-white z-10">
              <h2 class="font-bold text-lg">항목 및 입력 방식(텍스트/선택형) 관리</h2>
              <button onclick="state.configModalOpen=false;render()" class="text-2xl text-gray-400">&times;</button>
            </div>

            <form onsubmit="addNewField(event)" class="bg-emerald-50/70 p-3.5 rounded-xl space-y-2 border border-emerald-200">
              <h3 class="font-bold text-emerald-900">+ 새 입력 항목 추가하기 (금액 박스 위에 표시됨)</h3>
              <div class="grid grid-cols-2 gap-2">
                <input id="newFieldLabel" placeholder="새 항목명 입력" class="border rounded px-2.5 py-2 bg-white" />
                <select id="newFieldType" onchange="document.getElementById('newFieldOpts').style.display=this.value==='select'?'block':'none'" class="border rounded px-2.5 py-2 bg-white">
                  <option value="select">선택형 (드롭다운)</option>
                  <option value="text">직접 입력 (텍스트)</option>
                </select>
              </div>
              <input id="newFieldOpts" placeholder="선택 옵션 입력 (쉼표로 구분: 옵션1, 옵션2)" class="w-full border rounded px-2.5 py-2 bg-white" />
              <button type="submit" class="w-full py-2 bg-emerald-600 text-white rounded-lg font-semibold">새 항목 추가</button>
            </form>

            ${customCols.length > 0 ? `
              <div class="space-y-2">
                <h3 class="font-bold text-gray-700">추가된 항목 설정</h3>
                ${customCols.map(renderConfigRow).join("")}
              </div>` : ""}

            <div class="space-y-2 border-t pt-3">
              <h3 class="font-bold text-gray-700">기존 항목 입력 방식 전환 및 선택 목록 수정</h3>
              <p class="text-xs text-gray-500">각 항목의 방식을 [직접 입력] 또는 [선택형]으로 바꾼 뒤 '적용'을 누르세요.</p>
              <div class="space-y-2">
                ${sysCols.map(renderConfigRow).join("")}
              </div>
            </div>
          </div>
        </div>`;
    }

    init();
  </script>
</body>
</html>
