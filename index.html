    function formatKoreanPhone(val) {
      const nums = String(val || "").replace(/[^0-9]/g, "");
      if (!nums) return "";
      if (nums.startsWith("02")) {
        if (nums.length <= 2) return nums;
        if (nums.length <= 5) return `${nums.slice(0, 2)}-${nums.slice(2)}`;
        if (nums.length <= 9) return `${nums.slice(0, 2)}-${nums.slice(2, 5)}-${nums.slice(5)}`;
        return `${nums.slice(0, 2)}-${nums.slice(2, 6)}-${nums.slice(6, 10)}`;
      }
      if (nums.startsWith("1") && nums.length <= 8) {
        if (nums.length <= 4) return nums;
        return `${nums.slice(0, 4)}-${nums.slice(4, 8)}`;
      }
      if (nums.length <= 3) return nums;
      if (nums.length <= 6) return `${nums.slice(0, 3)}-${nums.slice(3)}`;
      if (nums.length <= 10) return `${nums.slice(0, 3)}-${nums.slice(3, 6)}-${nums.slice(6)}`;
      return `${nums.slice(0, 3)}-${nums.slice(3, 7)}-${nums.slice(7, 11)}`;
    }

    function normalizeStatus(st) {
      return String(st || "").replace(/\s+/g, "");
    }

    function formatDateTime(isoStr) {
      if (!isoStr) return "";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return String(isoStr).slice(0, 16).replace("T", " ");
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function getLocalDateStr(record, key) {
      const val = record[key];
      if (!val) return "";
      if (key === "created_at") {
        const d = new Date(val);
        if (isNaN(d.getTime())) return String(val).slice(0, 10);
        const pad = n => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }
      return String(val).slice(0, 10);
    }

    function calcLeadDays(startDate, endDate) {
      if (!startDate || !endDate) return null;
      const d1 = new Date(String(startDate).slice(0, 10) + "T00:00:00");
      const d2 = new Date(String(endDate).slice(0, 10) + "T00:00:00");
      if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return null;
      return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
    }

    function formatLeadDaysText(startDate, endDate) {
      const diff = calcLeadDays(startDate, endDate);
      if (diff === null) return "-";
      if (diff === 0) return "당일 (0일)";
      return `${diff}일`;
    }

    // 납기일 D-Day 및 카드/행 테마 계산 (출고완료, 출고대기, 발주취소는 경고 미적용)
    function getOrderDueTheme(dueDate, shipmentStatus) {
      const cleanStatus = normalizeStatus(shipmentStatus);
      if (cleanStatus === "출고완료") {
        return {
          level: "done",
          diff: null,
          cardClass: "bg-slate-50/90 border border-slate-200 border-l-4 border-l-emerald-500",
          rowClass: "bg-slate-50/50 hover:bg-emerald-50/40",
          dueBoxClass: "bg-emerald-50/80 border-emerald-200 text-emerald-900",
          badgeHtml: `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700">✓ 출고완료</span>`
        };
      }
      if (cleanStatus === "출고대기") {
        return {
          level: "ready",
          diff: null,
          cardClass: "bg-white border border-orange-200/80 border-l-4 border-l-orange-400",
          rowClass: "hover:bg-orange-50/40",
          dueBoxClass: "bg-orange-50/60 border-orange-200/80 text-orange-950",
          badgeHtml: ""
        };
      }
      if (cleanStatus === "발주취소") {
        return {
          level: "canceled",
          diff: null,
          cardClass: "bg-slate-100/80 border border-slate-200 border-l-4 border-l-slate-400 opacity-85",
          rowClass: "bg-slate-50/60 hover:bg-slate-100/60 text-slate-500",
          dueBoxClass: "bg-slate-100 border-slate-200 text-slate-600",
          badgeHtml: ""
        };
      }
      if (!dueDate) {
        return {
          level: "none",
          diff: null,
          cardClass: "bg-white border border-gray-200/90 border-l-4 border-l-sky-400",
          rowClass: "hover:bg-sky-50/50",
          dueBoxClass: "bg-slate-50 border-slate-200 text-slate-800",
          badgeHtml: ""
        };
      }
      const now = new Date();
      const todayZero = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dueZero = new Date(String(dueDate).slice(0, 10) + "T00:00:00");
      if (isNaN(dueZero.getTime())) {
        return {
          level: "none",
          diff: null,
          cardClass: "bg-white border border-gray-200/90 border-l-4 border-l-sky-400",
          rowClass: "hover:bg-sky-50/50",
          dueBoxClass: "bg-slate-50 border-slate-200 text-slate-800",
          badgeHtml: ""
        };
      }
      const diff = Math.round((dueZero - todayZero) / (1000 * 60 * 60 * 24));

      if (diff < 0) {
        return {
          level: "overdue",
          diff,
          cardClass: "bg-red-50/95 border border-red-300 border-l-4 border-l-red-600 shadow-sm",
          rowClass: "bg-red-50/85 hover:bg-red-100/80",
          dueBoxClass: "bg-red-100/90 border-red-300 text-red-950",
          badgeHtml: `<span class="px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-red-600 text-white shadow-xs">🚨 D+${Math.abs(diff)} 지연</span>`
        };
      }
      if (diff === 0) {
        return {
          level: "dday",
          diff,
          cardClass: "bg-orange-50/95 border border-orange-300 border-l-4 border-l-orange-500 shadow-sm",
          rowClass: "bg-orange-50/85 hover:bg-orange-100/80",
          dueBoxClass: "bg-orange-100/90 border-orange-300 text-orange-950",
          badgeHtml: `<span class="px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-orange-500 text-white shadow-xs">🔥 D-Day 오늘납기</span>`
        };
      }
      if (diff === 1) {
        return {
          level: "d1",
          diff,
          cardClass: "bg-amber-50 border-2 border-amber-300 border-l-4 border-l-amber-500 shadow-sm",
          rowClass: "bg-amber-50/90 hover:bg-amber-100/80",
          dueBoxClass: "bg-amber-100/90 border-amber-300 text-amber-950",
          badgeHtml: `<span class="px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-amber-500 text-white shadow-xs">⏰ D-1 내일납기</span>`
        };
      }
      if (diff <= 3) {
        return {
          level: "soon",
          diff,
          cardClass: "bg-white border border-sky-200 border-l-4 border-l-sky-500",
          rowClass: "hover:bg-sky-50/60",
          dueBoxClass: "bg-sky-50/80 border-sky-200 text-sky-950",
          badgeHtml: `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-sky-100 text-sky-700">D-${diff}</span>`
        };
      }
      return {
        level: "normal",
        diff,
        cardClass: "bg-white border border-gray-200/90 border-l-4 border-l-sky-400",
        rowClass: "hover:bg-sky-50/50",
        dueBoxClass: "bg-slate-50 border-slate-200 text-slate-800",
        badgeHtml: `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-600">D-${diff}</span>`
      };
    }

    function toggleMultiSelectChip(btnEl, inputId, wrapId, countId) {
      const opt = btnEl.getAttribute("data-opt");
      const hiddenInp = document.getElementById(inputId);
      const wrap = document.getElementById(wrapId);
      const countBadge = document.getElementById(countId);
      if (!hiddenInp || !wrap) return;

      let selected = hiddenInp.value
        ? hiddenInp.value.split(",").map(s => s.trim()).filter(Boolean)
        : [];

      if (opt === "없음" || opt === "해당없음") {
        selected = selected.includes(opt) ? [] : [opt];
      } else {
        selected = selected.filter(item => item !== "없음" && item !== "해당없음");
        if (selected.includes(opt)) {
          selected = selected.filter(item => item !== opt);
        } else {
          selected.push(opt);
        }
      }

      hiddenInp.value = selected.join(", ");

      wrap.querySelectorAll("button[data-opt]").forEach(b => {
        const val = b.getAttribute("data-opt");
        const active = selected.includes(val);
        b.className = active
          ? "px-2.5 py-1.5 rounded-lg text-xs font-bold border transition bg-indigo-600 text-white border-indigo-600 shadow-xs"
          : "px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition bg-white text-gray-700 border-gray-300 hover:bg-indigo-50";
        b.innerText = (active ? "✓ " : "") + val;
      });

      if (countBadge) {
        countBadge.innerText = selected.length > 0 ? `${selected.length}개 선택됨` : "";
      }
    }

    // 동일 스펙 복사 등록 (출고 현황 & 기대번호는 복사하지 않고 비움)

      state.orderConfigs.filter(c => !c.is_system).forEach(c => {

      state.isCopiedOrder = true;
      render();
      showToast("📋 복사 완료 (출고 현황·기대번호 제외). 입력 후 저장하세요.");
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.innerText = msg;
      t.classList.remove("opacity-0");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.add("opacity-0"), 2400);
    }

    async function copyText(text) {
      const clean = (text || "").replace(/\s+/g, " ").trim();
      if (!clean) return showToast("복사할 주소가 없습니다.");
      try {
        await navigator.clipboard.writeText(clean);
        showToast("📋 주소 복사 완료: " + clean);
      } catch (err) {
        const ta = document.createElement("textarea");
        ta.value = clean;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("📋 주소 복사 완료: " + clean);
      }
    }

    function copyModalAddress() {
      if (state.activeTab === "order") {
        const form = document.getElementById("orderRecordForm");
        if (!form) return;
        copyText(form.dest_address?.value || "");
        return;
      }
      const form = document.getElementById("asRecordForm");
      if (!form) return;
      const sido = form.region_sido?.value || "";
      const sigun = form.region_sigun?.value || "";
      const detail = form.address_detail?.value || "";
      copyText(`${sido} ${sigun} ${detail}`);
    }

    function switchTab(tab) {
      if (state.activeTab === tab) return;
      state.activeTab = tab;
      state.modalOpen = false;
      state.configModalOpen = false;
      state.exportModalOpen = false;
      state.editingRecord = null;
      state.isCopiedOrder = false;
      render();
    }

    function toggleOrderDateRangeMode() {
      state.orderDateRangeMode = !state.orderDateRangeMode;
      if (state.orderDateRangeMode) {
        if (state.orderDateSingle && !state.orderDateFrom) {
          state.orderDateFrom = state.orderDateSingle;
        }
      } else {
        if (state.orderDateFrom && !state.orderDateSingle) {
          state.orderDateSingle = state.orderDateFrom;
        }
      }
      render();
    }

    function clearOrderDateFilter() {
      state.orderDateSingle = "";
      state.orderDateFrom = "";
      state.orderDateTo = "";
      render();
    }

    function hasAnyActiveFilter() {
      if (state.activeTab === "order") {
        const hasOrderDate = state.orderDateRangeMode
          ? Boolean(state.orderDateFrom || state.orderDateTo)
          : Boolean(state.orderDateSingle);
        return Boolean(
          state.orderSearch ||
          state.orderStatusFilter !== "전체" ||
          state.orderModelFilter !== "전체" ||
          state.orderOrdererFilter !== "전체" ||
          state.orderDestTypeFilter !== "전체" ||
          hasOrderDate ||
          state.orderSortKey !== "created_at" ||
          state.orderSortDir !== "desc"
        );
      }
      return Boolean(
        state.search ||
        state.statusFilter !== "전체" ||
        state.sidoFilter !== "전체" ||
        state.modelFilter !== "전체" ||
        state.visitorFilter !== "전체" ||
        state.dateFrom ||
        state.dateTo ||
        state.sortKey !== "created_at" ||
        state.sortDir !== "desc"
      );
    }

    function handleSearchInput(val) {
      if (state.activeTab === "order") {
        state.orderSearch = val;
      } else {
        state.search = val;
      }
      const resetBtn = document.getElementById("resetFilterBtn");
      if (resetBtn) {
        resetBtn.style.display = hasAnyActiveFilter() ? "inline-flex" : "none";
      }
      renderRecordsArea();
    }

    function setQuickStatusFilter(st) {
      if (state.activeTab === "order") {
        if (st === "전체" || st === "긴급납기") {
          state.orderStatusFilter = st;
        } else {
          const opts = getOrderCfg("shipment_status")?.options || [];
          const matched = opts.find(o => normalizeStatus(o) === normalizeStatus(st));
          state.orderStatusFilter = matched || st;
        }
        render();
        return;
      }
      if (st === "전체") {

        .on("postgres_changes", { event: "*", schema: "public", table: "as_records" }, async () => {
          await loadAllData(true);
          if (state.modalOpen || state.configModalOpen || state.exportModalOpen || state.pwModalOpen) {
            renderRecordsArea();

        .on("postgres_changes", { event: "*", schema: "public", table: "order_records" }, async () => {
          await loadAllData(true);
          if (state.modalOpen || state.configModalOpen || state.exportModalOpen || state.pwModalOpen) {
            renderRecordsArea();

            render();

          showToast("🔔 KOASIS 발주 대장 변경사항이 실시간 반영되었습니다");

        .on("postgres_changes", { event: "*", schema: "public", table: "field_configs" }, async () => {
          await loadAllData(true);
          if (!state.modalOpen && !state.configModalOpen && state.activeTab === "as") render();
        })

    async function loadAllData(silent = false) {
      const [recRes, cfgRes, ordRes, ordCfgRes, teamRes] = await Promise.all([
        sb.from("as_records").select("*").order("created_at", { ascending: false }),
        sb.from("field_configs").select("*").order("sort_order", { ascending: true }),
        sb.from("order_records").select("*").order("created_at", { ascending: false }),
        sb.from("order_field_configs").select("*").order("sort_order", { ascending: true }),
        sb.from("team_profiles").select("username")
      ]);
      if (recRes.data) state.records = recRes.data;
      if (cfgRes.data) state.configs = cfgRes.data;
      if (ordRes.data) state.orderRecords = ordRes.data;
      if (teamRes.data) {
        state.teamUsernames = teamRes.data.map(t => t.username).filter(Boolean);
      }

      const buildDefaultConfigsWithTeam = () => DEFAULT_ORDER_CONFIGS.map(c => {
        if (c.field_key === "orderer" && state.teamUsernames.length > 0) {
          return { ...c, options: [...state.teamUsernames] };
        }
        return { ...c };
      });

      if (ordCfgRes.data && ordCfgRes.data.length > 0) {
        let cfgs = ordCfgRes.data;
        for (const c of cfgs) {
          if (ORDER_FORCE_SELECT_KEYS.includes(c.field_key) && c.field_type !== "select") {
            const defCfg = buildDefaultConfigsWithTeam().find(d => d.field_key === c.field_key);
            const nextOpts = (c.options && c.options.length > 0) ? c.options : (defCfg?.options || []);
            c.field_type = "select";
            c.options = nextOpts;
            if (c.id) {
              await sb.from("order_field_configs").update({ field_type: "select", options: nextOpts }).eq("id", c.id);
            }
          }
        }
        state.orderConfigs = cfgs;
      } else if (!ordCfgRes.error && ordCfgRes.data && ordCfgRes.data.length === 0) {
        const initRows = buildDefaultConfigsWithTeam();
        const { data: inserted } = await sb.from("order_field_configs").insert(initRows).select("*").order("sort_order", { ascending: true });
        state.orderConfigs = inserted && inserted.length > 0 ? inserted : initRows;
      } else {
        state.orderConfigs = buildDefaultConfigsWithTeam();
      }
    }

    function getSavedCredentials() {
      try {
        const raw = localStorage.getItem(SAVED_CREDS_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const nameInput = document.getElementById("loginName").value.trim();
      const pwInput = document.getElementById("loginPw").value;
      const rememberChecked = document.getElementById("rememberLogin")?.checked;
      if (!nameInput || !pwInput) return alert("이름과 비밀번호를 입력하세요.");

      const { data: prof, error: profErr } = await sb.from("team_profiles").select("email").eq("username", nameInput).single();
      if (profErr || !prof) return alert("등록되지 않은 팀원 이름입니다.");

      const { data, error } = await sb.auth.signInWithPassword({ email: prof.email, password: pwInput });
      if (error) return alert("비밀번호가 일치하지 않습니다.");

      try {
        if (rememberChecked) {
          localStorage.setItem(SAVED_CREDS_KEY, JSON.stringify({ username: nameInput, password: pwInput }));
        } else {
          localStorage.removeItem(SAVED_CREDS_KEY);
        }
      } catch (err) {}

      state.user = data.user;
      state.username = nameInput;
      await loadAllData();
      setupRealtimeSync();
      render();
    }

    async function handleLogout() {
      if (realtimeChannel) {
        sb.removeChannel(realtimeChannel);
        realtimeChannel = null;

      await sb.auth.signOut();
      state.user = null;
      state.username = "";

    async function handleChangePassword(e) {
      e.preventDefault();
      const newPw = document.getElementById("newPwInput").value;
      if (newPw.length < 6) return alert("비밀번호는 6자리 이상으로 입력하세요.");
      const { error } = await sb.auth.updateUser({ password: newPw });
      if (error) return alert("변경 실패: " + error.message);

      try {
        const saved = getSavedCredentials();
        if (saved && saved.username === state.username) {

    function setExportPreset(type) {
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      if (type === "all") {
        state.exportDateFrom = "";
        state.exportDateTo = "";
      } else if (type === "thisMonth") {
        const y = now.getFullYear();
        const m = now.getMonth() + 1;
        const lastDay = new Date(y, m, 0).getDate();
        state.exportDateFrom = `${y}-${pad(m)}-01`;
        state.exportDateTo = `${y}-${pad(m)}-${pad(lastDay)}`;
      } else if (type === "lastMonth") {
        const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const y = prev.getFullYear();
        const m = prev.getMonth() + 1;
        const lastDay = new Date(y, m, 0).getDate();
        state.exportDateFrom = `${y}-${pad(m)}-01`;
        state.exportDateTo = `${y}-${pad(m)}-${pad(lastDay)}`;
      }
      render();
    }

    function getVatAmount(payType, repair, parts) {
      const sum = (repair || 0) + (parts || 0);
      if (payType === "세금계산서") return Math.round(sum * 0.1);
      return 0;
    }

    function calculateTotal(payType, repair, parts) {
      const sum = (repair || 0) + (parts || 0);
      if (payType === "세금계산서") return sum + getVatAmount(payType, repair, parts);
      if (payType === "무상") return 0;
      return sum;
    }

    // AS 접수 대장 필터
    function matchesBaseFilters(r) {
      if (state.sidoFilter !== "전체" && r.region_sido !== state.sidoFilter) return false;
      if (state.modelFilter !== "전체" && (r.model_name || "") !== state.modelFilter) return false;
      if (state.visitorFilter !== "전체" && (r.visitor || "") !== state.visitorFilter) return false;

      if (state.dateFrom || state.dateTo) {
        const dVal = getLocalDateStr(r, state.dateFilterKey);
        if (!dVal) return false;
        if (state.dateFrom && dVal < state.dateFrom) return false;
        if (state.dateTo && dVal > state.dateTo) return false;
      }

      if (state.search) {
        const q = state.search.toLowerCase().trim();
        const qDigits = q.replace(/-/g, "");
        const target = `${r.customer_name} ${r.phone} ${r.dealer_phone} ${r.model_name} ${r.serial_number} ${r.dealer_name} ${r.visitor} ${r.region_sido} ${r.region_sigun} ${r.address_detail} ${r.symptom_category} ${r.symptom_detail} ${r.created_by}`.toLowerCase();
        const phoneDigits = `${r.phone || ""} ${r.dealer_phone || ""}`.replace(/-/g, "");
        if (!target.includes(q) && !(qDigits && phoneDigits.includes(qDigits))) return false;
      }
      return true;
    }

    function getFilteredRecords() {
      const filtered = state.records.filter(r => {
        if (state.statusFilter !== "전체" && normalizeStatus(r.status) !== normalizeStatus(state.statusFilter)) return false;
        return matchesBaseFilters(r);
      });

      const key = state.sortKey;
      const mult = state.sortDir === "asc" ? 1 : -1;

      return [...filtered].sort((a, b) => {
        if (key === "elapsed_days") {
          const da = calcLeadDays(a.receipt_date, a.completed_date);
          const db = calcLeadDays(b.receipt_date, b.completed_date);
          if (da === null && db === null) return 0;
          if (da === null) return 1;
          if (db === null) return -1;
          return (da - db) * mult;
        }
        if (key === "vat_cost") {
          const va = getVatAmount(a.payment_type || "", a.repair_cost, a.parts_cost);
          const vb = getVatAmount(b.payment_type || "", b.repair_cost, b.parts_cost);
          return (va - vb) * mult;
        }
        if (NUMBER_KEYS.includes(key)) {
          return ((a[key] || 0) - (b[key] || 0)) * mult;
        }
        if (key === "urgency") {
          return ((URGENCY_RANK[a.urgency] || 2) - (URGENCY_RANK[b.urgency] || 2)) * mult;
        }
        if (key === "region_sido") {
          const va = `${a.region_sido || ""} ${a.region_sigun || ""}`.trim();
          const vb = `${b.region_sido || ""} ${b.region_sigun || ""}`.trim();
          if (!va && !vb) return 0;
          if (!va) return 1;
          if (!vb) return -1;
          return va.localeCompare(vb, "ko") * mult;
        }
        const va = String(a[key] ?? "").trim();
        const vb = String(b[key] ?? "").trim();
        if (!va && !vb) return 0;
        if (!va) return 1;
        if (!vb) return -1;
        return va.localeCompare(vb, "ko") * mult;
      });
    }

    // KOASIS 발주 대장 필터
    function matchesOrderBaseFilters(r) {
      if (state.orderModelFilter !== "전체" && (r.model_name || "") !== state.orderModelFilter) return false;
      if (state.orderOrdererFilter !== "전체" && (r.orderer || "") !== state.orderOrdererFilter) return false;
      if (state.orderDestTypeFilter !== "전체" && (r.dest_type || "") !== state.orderDestTypeFilter) return false;

      if (state.orderDateRangeMode) {
        if (state.orderDateFrom || state.orderDateTo) {
          const dVal = getLocalDateStr(r, state.orderDateFilterKey);
          if (!dVal) return false;
          if (state.orderDateFrom && dVal < state.orderDateFrom) return false;
          if (state.orderDateTo && dVal > state.orderDateTo) return false;
        }
      } else {
        if (state.orderDateSingle) {
          const dVal = getLocalDateStr(r, state.orderDateFilterKey);
          if (!dVal || dVal !== state.orderDateSingle) return false;
        }
      }

      if (state.orderSearch) {
        const q = state.orderSearch.toLowerCase().trim();
        const qDigits = q.replace(/-/g, "");
        const target = `${r.client_name} ${r.shipment_status} ${r.model_name} ${r.orderer} ${r.pump_change} ${r.option_add} ${r.serial_number} ${r.dest_type} ${r.dest_address} ${r.dest_phone} ${r.remarks} ${r.created_by}`.toLowerCase();
        const phoneDigits = `${r.dest_phone || ""}`.replace(/-/g, "");
        if (!target.includes(q) && !(qDigits && phoneDigits.includes(qDigits))) return false;
      }
      return true;
    }

    function getFilteredOrderRecords() {
      const filtered = state.orderRecords.filter(r => {
        if (state.orderStatusFilter === "긴급납기") {
          const theme = getOrderDueTheme(r.due_date, r.shipment_status);
          if (!["overdue", "dday", "d1"].includes(theme.level)) return false;
        } else if (state.orderStatusFilter !== "전체" && normalizeStatus(r.shipment_status) !== normalizeStatus(state.orderStatusFilter)) {
          return false;
        }
        return matchesOrderBaseFilters(r);
      });

      const key = state.orderSortKey;
      const mult = state.orderSortDir === "asc" ? 1 : -1;

      return [...filtered].sort((a, b) => {
        if (key === "lead_days") {
          const da = calcLeadDays(a.receipt_date, a.due_date);
          const db = calcLeadDays(b.receipt_date, b.due_date);
          if (da === null && db === null) return 0;
          if (da === null) return 1;
          if (db === null) return -1;
          return (da - db) * mult;
        }
        const va = String(a[key] ?? "").trim();
        const vb = String(b[key] ?? "").trim();
        if (!va && !vb) return 0;
        if (!va) return 1;
        if (!vb) return -1;
        return va.localeCompare(vb, "ko") * mult;
      });
    }

    function getExportTargetRecords() {
      const isOrder = state.activeTab === "order";
      const baseRows = isOrder ? getFilteredOrderRecords() : getFilteredRecords();
      if (!state.exportDateFrom && !state.exportDateTo) return baseRows;
      return baseRows.filter(r => {
        const dVal = getLocalDateStr(r, state.exportDateKey);
        if (!dVal) return false;
        if (state.exportDateFrom && dVal < state.exportDateFrom) return false;
        if (state.exportDateTo && dVal > state.exportDateTo) return false;
        return true;
      });
    }

    function exportExcel(format) {
      const isOrder = state.activeTab === "order";
      const rows = getExportTargetRecords();
      if (rows.length === 0) return alert("선택한 기간에 해당하는 내역이 없습니다.");

      let headers = [];
      let dataRows = [];
      const baseFileName = isOrder ? "KOASIS발주대장" : "AS접수대장";

      if (isOrder) {
        const sysCols = ORDER_SYSTEM_KEYS.map(k => getOrderCfg(k)).filter(Boolean);
        const customCols = state.orderConfigs.filter(c => !c.is_system);

        headers = [
          ...sysCols.map(c => c.field_label),
          "소요 예정일",
          ...customCols.map(c => c.field_label),
          "생성일시", "생성자", "최종 편집 일시", "최종 편집자"
        ];

        dataRows = rows.map(r => [
          ...sysCols.map(c => r[c.field_key] ?? ""),
          formatLeadDaysText(r.receipt_date, r.due_date),
          ...customCols.map(c => (r.custom_fields && r.custom_fields[c.field_key]) || ""),
          formatDateTime(r.created_at),
          r.created_by || "",
          r.updated_at && r.updated_by ? formatDateTime(r.updated_at) : "",
          r.updated_by || ""
        ]);
      } else {
        const sysCols = SYSTEM_KEYS.map(k => getCfg(k)).filter(Boolean);
        const customCols = state.configs.filter(c => !c.is_system);

        headers = [
          ...sysCols.map(c => c.field_label),
          "소요일",
          ...customCols.map(c => c.field_label),
          "출장비구분", "출장비", "부품비", "부가세", "최종합계", "작성일", "최초작성자", "최종수정자"
        ];

        dataRows = rows.map(r => {
          const pt = r.payment_type || "";
          const vat = getVatAmount(pt, r.repair_cost, r.parts_cost);
          return [
            ...sysCols.map(c => r[c.field_key] ?? ""),
            formatLeadDaysText(r.receipt_date, r.completed_date),
            ...customCols.map(c => (r.custom_fields && r.custom_fields[c.field_key]) || ""),
            pt,
            r.repair_cost || 0,
            r.parts_cost || 0,
            vat,
            r.total_cost || 0,
            formatDateTime(r.created_at),
            r.created_by || "",
            r.updated_by || ""
          ];
        });
      }

      const rangeSuffix = (state.exportDateFrom || state.exportDateTo)
        ? `_${state.exportDateFrom || "처음"}~${state.exportDateTo || "현재"}`
        : `_${new Date().toISOString().slice(0, 10)}`;

      if (format === "xls" || format === "xlsx") {
        const ws = XLSX.utils.aoa_to_sheet([headers, ...dataRows]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, baseFileName);

        if (format === "xls") {
          XLSX.writeFile(wb, `${baseFileName}${rangeSuffix}.xls`, { bookType: "biff8" });
        } else {
          XLSX.writeFile(wb, `${baseFileName}${rangeSuffix}.xlsx`, { bookType: "xlsx" });
        }
      } else {
        const csvLines = [
          headers.join(","),
          ...dataRows.map(row => row.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(","))
        ];
        const blob = new Blob(["\uFEFF" + csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${baseFileName}${rangeSuffix}.csv`;
        a.click();
      }

      state.exportModalOpen = false;
      render();
      showToast(`📥 ${rows.length}건 (${format.toUpperCase()}) 다운로드 완료`);
    }

    // 목록 배지 색상 (제작중: 하늘색, 출고대기: 주황색, 출고완료: 초록색, 발주취소/보류: 회색)
    function statusBadge(st) {
      const clean = normalizeStatus(st);
      if (clean === "접수" || clean === "발주접수") return "bg-blue-100 text-blue-700 border border-blue-200";
      if (clean === "제작중" || clean === "생산중") return "bg-sky-100 text-sky-700 border border-sky-200";
      if (clean === "출고대기") return "bg-orange-100 text-orange-700 border border-orange-200";
      if (clean === "부품대기" || clean === "자재준비") return "bg-rose-100 text-rose-700 border border-rose-200";
      if (clean === "타업체수리요청") return "bg-purple-100 text-purple-700 border border-purple-200";
      if (clean === "프로그램수정대기") return "bg-indigo-100 text-indigo-700 border border-indigo-200";
      if (clean === "처리완료" || clean === "출고완료") return "bg-emerald-100 text-emerald-700 border border-emerald-200";
      if (clean === "처리중" || clean === "대기중") return "bg-amber-100 text-amber-800 border border-amber-200";
      if (clean === "보류" || clean === "발주취소") return "bg-slate-200 text-slate-700 border border-slate-300";
      return "bg-slate-100 text-slate-700 border border-slate-200";
    }

    function urgencyBadge(ug) {
      const clean = normalizeStatus(ug);
      if (clean === "매우긴급" || clean === "최긴급") return "bg-red-600 text-white";
      if (clean === "다소긴급" || clean === "긴급") return "bg-orange-100 text-orange-700 border border-orange-200";
      if (clean === "낮음") return "bg-sky-100 text-sky-700";
      return "bg-slate-100 text-slate-600";
    }

    function getAsCardBorderClass(r) {
      if (normalizeStatus(r.status) === "처리완료") return "bg-slate-50/90 border border-slate-200 border-l-4 border-l-emerald-500";
      const ug = normalizeStatus(r.urgency);
      if (ug === "매우긴급" || ug === "최긴급") return "bg-red-50/40 border border-red-200 border-l-4 border-l-red-600";
      if (ug === "다소긴급" || ug === "긴급") return "bg-orange-50/35 border border-orange-200 border-l-4 border-l-orange-500";
      return "bg-white border border-slate-200/90 border-l-4 border-l-blue-500";
    }

    function paymentBadge(pt) {
      if (pt === "세금계산서") return "bg-indigo-100 text-indigo-700";
      if (pt === "무상") return "bg-gray-200 text-gray-700";
      if (pt === "현금") return "bg-emerald-100 text-emerald-700";
      return "bg-gray-100 text-gray-500";
    }

    function calcModalTotal() {
      const payType = document.getElementById("inpPaymentType")?.value || "";
      const r = parseInt(document.getElementById("inpRepairCost")?.value || 0, 10);
      const p = parseInt(document.getElementById("inpPartsCost")?.value || 0, 10);
      const vat = getVatAmount(payType, r, p);
      const total = calculateTotal(payType, r, p);

      const vatEl = document.getElementById("inpVatCost");
      const el = document.getElementById("modalTotalDisplay");
      const subEl = document.getElementById("modalSubDisplay");

      if (vatEl) vatEl.value = vat.toLocaleString() + "원";
      if (el) el.innerText = total.toLocaleString() + "원";
      if (subEl) {
        if (payType === "세금계산서") {
          subEl.innerText = `(공급가 ${(r+p).toLocaleString()}원 + 부가세 ${vat.toLocaleString()}원)`;
        } else if (payType === "무상") {
          subEl.innerText = `(내부 발생비용 ${(r+p).toLocaleString()}원 / 부가세 0원 / 청구 0원)`;
        } else if (payType === "현금") {
          subEl.innerText = `(출장비 + 부품비 / 부가세 0원)`;
        } else {
          subEl.innerText = `(출장비 + 부품비 / 출장비 구분 미선택)`;
        }
      }
    }

    function getCfg(key) {
      return state.configs.find(c => c.field_key === key);
    }

    function getOrderCfg(key) {
      const found = state.orderConfigs.find(c => c.field_key === key);
      const fallback = DEFAULT_ORDER_CONFIGS.find(c => c.field_key === key);
      const cfg = found || fallback;
      if (!cfg) return null;
      if (ORDER_FORCE_SELECT_KEYS.includes(key)) {
        let mergedOpts = [...(cfg.options || [])];
        if (mergedOpts.length === 0 && key === "orderer" && state.teamUsernames.length > 0) {
          mergedOpts = [...state.teamUsernames];
        }
        if (mergedOpts.length === 0 && fallback?.options) {
          mergedOpts = [...fallback.options];
        }
        return { ...cfg, field_type: "select", options: mergedOpts };
      }
      return cfg;
    }

    function renderSortTh(key, label, alignRight = false) {
      const curKey = state.activeTab === "order" ? state.orderSortKey : state.sortKey;
      const curDir = state.activeTab === "order" ? state.orderSortDir : state.sortDir;
      const active = curKey === key;
      const icon = active
        ? (curDir === "asc" ? `<span class="text-blue-600 ml-1">▲</span>` : `<span class="text-blue-600 ml-1">▼</span>`)
        : `<span class="text-gray-300 ml-1">⇅</span>`;
      return `
        <th onclick="toggleSort('${key}')" class="p-3 cursor-pointer select-none hover:bg-slate-100 transition ${alignRight ? "text-right" : ""} ${active ? "text-blue-700 bg-blue-50/70" : ""}">
          ${label}${icon}
        </th>`;
    }

              전체 <b>${totalCnt}</b>건
            </button>

              접수 <b>${receiptCnt}</b>

              타업체요청 <b>${externalRepairCnt}</b>
            </button>
            <button type="button" onclick="setQuickStatusFilter('프로그램 수정 대기')" class="px-3 py-1.5 rounded-xl font-bold transition ${activeNorm === "프로그램수정대기" ? "bg-indigo-600 text-white shadow-sm" : "bg-indigo-50 text-indigo-700 hover:bg-indigo-100"}">
              프로그램수정 <b>${programModCnt}</b>

        <div class="text-xs text-slate-500 mb-2 px-1 flex justify-between items-center">
          <div>현재 목록 <b class="text-slate-800">${filtered.length}</b>건 표시 중 <span class="hidden md:inline">(표 맨 윗줄의 항목 제목을 누르면 정렬됩니다)</span></div>

                ${renderSortTh("region_sido", "지역")}
                ${renderSortTh("phone", "연락처")}
                ${renderSortTh("model_name", "모델(기대번호)")}

                return `

              <input id="newPwInput" type="password" placeholder="새 비밀번호 (6자리 이상)" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5" required />
              <div class="flex justify-end gap-2">
                <button type="button" onclick="state.pwModalOpen=false;render()" class="px-4 py-2 bg-slate-100 rounded-xl font-semibold">취소</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold">변경하기</button>
              </div>
            </form>
          </div>` : ""}
      `;
    }

    function renderDynamicInput(cfg, val, isRequired = false) {
      const nameAttr = cfg.is_system ? cfg.field_key : `custom_${cfg.field_key}`;
      const reqAttr = isRequired ? "required" : "";
      const isOrderMultiOption = (state.activeTab === "order" && cfg.field_key === "option_add");
      const isAsSymptomMulti = (state.activeTab === "as" && cfg.field_key === "symptom_category");
      const isMultiChip = isOrderMultiOption || isAsSymptomMulti;
      const isFullSpan = (cfg.field_key === "address_detail" || cfg.field_key === "dest_address" || cfg.field_type === "textarea" || isMultiChip);
      const fullSpan = isFullSpan ? "col-span-2" : "";
      const isPhone = PHONE_KEYS.includes(cfg.field_key);
      const isOrderDateTrigger = state.activeTab === "order" && (cfg.field_key === "receipt_date" || cfg.field_key === "due_date");
      const isAsDateTrigger = state.activeTab === "as" && (cfg.field_key === "receipt_date" || cfg.field_key === "completed_date");

      if (isMultiChip) {
        const inputId = isOrderMultiOption ? "inpOptionAdd" : "inpSymptomCategory";
        const wrapId = isOrderMultiOption ? "optionAddWrap" : "symptomCatWrap";
        const countId = isOrderMultiOption ? "optionAddCount" : "symptomCatCount";
        const selected = String(val || "").split(",").map(s => s.trim()).filter(Boolean);
        const defaultSymptomOpts = ["전원/통신불량", "센서이상", "EC/pH이상", "펌프/밸브이상", "관수제어이상", "프로그램/설정", "누수/배관", "기타"];
        const baseOpts = (cfg.options && cfg.options.length > 0)
          ? cfg.options
          : (isAsSymptomMulti ? defaultSymptomOpts : []);
        const allOpts = Array.from(new Set([...baseOpts, ...selected]));

        return `
          <div class="${fullSpan} bg-indigo-50/60 border border-indigo-200/80 rounded-2xl p-3">
            <div class="flex justify-between items-center mb-2">
              <label class="block font-bold text-slate-800">${cfg.field_label} <span class="text-xs font-normal text-indigo-700">(중복 선택 가능)</span></label>
              <span id="${countId}" class="text-xs font-extrabold text-indigo-700">${selected.length > 0 ? `${selected.length}개 선택됨` : ""}</span>
            </div>
            <input type="hidden" id="${inputId}" name="${nameAttr}" value="${selected.join(", ").replace(/"/g, "&quot;")}" />
            <div id="${wrapId}" class="flex flex-wrap gap-1.5">
              ${allOpts.map(o => {
                const active = selected.includes(o);
                const safeOpt = o.replace(/"/g, "&quot;");
                return `
                  <button type="button" data-opt="${safeOpt}" onclick="toggleMultiSelectChip(this, '${inputId}', '${wrapId}', '${countId}')"
                    class="${active
                      ? "px-2.5 py-1.5 rounded-lg text-xs font-bold border transition bg-indigo-600 text-white border-indigo-600 shadow-xs"
                      : "px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition bg-white text-slate-700 border-slate-300 hover:bg-indigo-50"}">
                    ${active ? "✓ " : ""}${o}
                  </button>`;
              }).join("")}
            </div>
          </div>`;
      }

      let inputHtml = "";
      if (cfg.field_type === "select") {
        const opts = cfg.options || [];
        inputHtml = `
          <select name="${nameAttr}" ${reqAttr} class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">선택</option>
            ${opts.map(o => `<option value="${o}" ${val === o ? "selected" : ""}>${o}</option>`).join("")}
            ${val && !opts.includes(val) ? `<option value="${val}" selected>${val}</option>` : ""}
          </select>`;
      } else if (cfg.field_type === "date" || DATE_KEYS.includes(cfg.field_key)) {
        const onChangeAttr = isOrderDateTrigger
          ? `onchange="updateModalLeadTime()"`
          : (isAsDateTrigger ? `onchange="updateAsModalElapsedDays()"` : "");
        inputHtml = `<input type="date" name="${nameAttr}" value="${val}" ${onChangeAttr} ${reqAttr} class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />`;
      } else if (cfg.field_type === "textarea" || TEXTAREA_KEYS.includes(cfg.field_key)) {
        inputHtml = `<textarea name="${nameAttr}" rows="2" ${reqAttr} class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">${val}</textarea>`;
      } else if (isPhone) {
        const formattedPhone = formatKoreanPhone(val);
        inputHtml = `<input type="tel" name="${nameAttr}" value="${formattedPhone}" oninput="this.value=formatKoreanPhone(this.value)" placeholder="숫자만 입력 (자동 하이픈)" ${reqAttr} class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />`;
      } else {
        inputHtml = `<input type="text" name="${nameAttr}" value="${val}" ${reqAttr} class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />`;
      }

      const copyBtn = (cfg.field_key === "address_detail" || cfg.field_key === "dest_address")
        ? `<button type="button" onclick="copyModalAddress()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-2.5 py-0.5 rounded-lg font-bold">📋 주소 복사</button>`
        : "";

      return `
        <div class="${fullSpan}">
          <div class="flex justify-between items-center mb-1">
            <label class="block font-bold text-xs text-slate-700">${cfg.field_label}${isRequired ? ' <span class="text-red-500 font-bold">*</span>' : ""}</label>
            ${copyBtn}
          </div>
          ${inputHtml}
        </div>`;
    }

    // AS 접수 대장 입력/수정 모달
    function renderFormModal() {
      const r = state.editingRecord || {};
      const today = new Date().toISOString().slice(0, 10);

      const initReceipt = r.id ? (r.receipt_date || "") : today;
      const initCompleted = r.completed_date || "";
      const elapsedText = formatLeadDaysText(initReceipt, initCompleted);

      const payType = r.payment_type ?? "";
      const repair = r.repair_cost || 0;
      const parts = r.parts_cost || 0;
      const vat = getVatAmount(payType, repair, parts);
      const total = calculateTotal(payType, repair, parts);

      let subText = "(출장비 + 부품비 / 출장비 구분 미선택)";
      if (payType === "세금계산서") subText = `(공급가 ${(repair+parts).toLocaleString()}원 + 부가세 ${vat.toLocaleString()}원)`;
      if (payType === "무상") subText = `(내부 발생비용 ${(repair+parts).toLocaleString()}원 / 부가세 0원 / 청구 0원)`;
      if (payType === "현금") subText = "(출장비 + 부품비 / 부가세 0원)";

      return `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-end md:items-center justify-center z-40 overflow-y-auto">
          <form id="asRecordForm" onsubmit="saveRecord(event)" class="bg-white w-full max-w-2xl rounded-t-3xl md:rounded-3xl p-5 max-h-[92vh] overflow-y-auto space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-200 pb-3 sticky top-0 bg-white z-10">
              <div>
                <h2 class="font-extrabold text-lg text-slate-900">${r.id ? "AS 내역 상세 / 수정" : "새 AS 접수 등록"}</h2>
                <p class="text-xs text-slate-500 mt-0.5"><span class="text-red-500 font-bold">*</span> 표시는 필수 입력 항목입니다</p>
              </div>
              <button type="button" onclick="state.modalOpen=false;render()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none px-1">&times;</button>
            </div>

            ${r.id ? `<div class="text-xs bg-slate-100 p-2.5 rounded-xl text-slate-600">작성일: <b>${formatDateTime(r.created_at)}</b> (작성자: <b>${r.created_by}</b>) / 최종 수정: <b>${r.updated_by || "-"}</b>${r.updated_at && r.updated_by ? ` (${formatDateTime(r.updated_at)})` : ""}</div>` : ""}

            <div class="grid grid-cols-2 gap-3 text-sm">
              ${sysCols.map(c => {
                let val = r[c.field_key] ?? "";
                if (!r.id && c.field_key === "receipt_date") val = today;
                if (!r.id && c.field_key === "status") val = "접수";
                if (!r.id && c.field_key === "urgency") val = defaultUrgency;
                if (!r.id && c.field_key === "receipt_channel") val = "전화";
                if (!r.id && c.field_key === "replacement_type") val = "해당없음";
                const fieldHtml = renderDynamicInput(c, val, REQUIRED_KEYS.includes(c.field_key));
                if (c.field_key === "completed_date") {
                  return fieldHtml + `
                    <div class="col-span-2 bg-emerald-50/80 border border-emerald-200/80 rounded-2xl px-3.5 py-2.5 flex justify-between items-center text-xs sm:text-sm">
                      <span class="font-bold text-emerald-900">⏱️ 소요일 (접수일자 ~ 처리완료일 자동 계산)</span>
                      <span id="asModalElapsedDisplay" class="font-extrabold text-emerald-700 text-base">${elapsedText}</span>
                    </div>`;
                }
                return fieldHtml;
              }).join("")}
            </div>

            ${customCols.length > 0 ? `
              <div class="border-t border-slate-200 pt-3 grid grid-cols-2 gap-3 text-sm">
                ${customCols.map(c => {
                  const val = (r.custom_fields && r.custom_fields[c.field_key]) || "";
                  return renderDynamicInput(c, val, false);
                }).join("")}
              </div>` : ""}

            <div class="bg-blue-50/80 border border-blue-200 p-3.5 rounded-2xl space-y-3 text-sm">
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <div>
                  <label class="block font-bold text-xs text-blue-900 mb-1">출장비 구분</label>
                  <select id="inpPaymentType" name="payment_type" onchange="calcModalTotal()" class="w-full border border-blue-200 rounded-xl px-2 py-2 bg-white font-bold">
                    <option value="" ${payType===""?"selected":""}>선택</option>
                    <option value="현금" ${payType==="현금"?"selected":""}>현금</option>
                    <option value="세금계산서" ${payType==="세금계산서"?"selected":""}>세금계산서</option>
                    <option value="무상" ${payType==="무상"?"selected":""}>무상</option>
                  </select>
                </div>
                <div>
                  <label class="block font-bold text-xs text-slate-700 mb-1">출장비 (원)</label>
                  <input id="inpRepairCost" type="number" name="repair_cost" value="${repair}" oninput="calcModalTotal()" class="w-full border border-slate-300 rounded-xl px-2.5 py-2 bg-white" />

                <div>
                  <label class="block font-bold text-xs text-slate-700 mb-1">부품비 (원)</label>
                  <input id="inpPartsCost" type="number" name="parts_cost" value="${parts}" oninput="calcModalTotal()" class="w-full border border-slate-300 rounded-xl px-2.5 py-2 bg-white" />

                <div>
                  <label class="block font-bold text-xs text-indigo-900 mb-1">부가세 (자동)</label>
                  <input id="inpVatCost" type="text" value="${vat.toLocaleString()}원" readonly tabindex="-1" class="w-full border border-blue-200 rounded-xl px-2.5 py-2 bg-blue-100/70 text-indigo-900 font-bold text-right cursor-not-allowed focus:outline-none" />
                </div>
              </div>
              <div class="flex justify-between items-center border-t border-blue-200 pt-2">
                <span id="modalSubDisplay" class="text-xs text-blue-800">${subText}</span>
                <div class="text-right">
                  <span class="text-xs text-slate-600 mr-1">최종 합계</span>
                  <span id="modalTotalDisplay" class="font-extrabold text-lg text-blue-700">${total.toLocaleString()}원</span>
                </div>
              </div>
            </div>

            <div class="flex justify-between pt-3 border-t border-slate-200">
              ${r.id ? `<button type="button" onclick="deleteRecord('${r.id}')" class="px-4 py-2.5 text-red-600 bg-red-50 hover:bg-red-100 rounded-xl text-sm font-bold">삭제</button>` : `<div></div>`}
              <div class="flex gap-2">
                <button type="button" onclick="state.modalOpen=false;render()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-bold">취소</button>
                <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-extrabold shadow-sm">저장하기</button>
              </div>
            </div>
          </form>
        </div>`;
    }

    // KOASIS 발주 대장 입력/수정 모달 (발주자 기본값은 '선택')
    function renderOrderFormModal() {
      const r = state.editingRecord || {};
      const today = new Date().toISOString().slice(0, 10);
      const isEditExisting = Boolean(r.id);
      const hasPrefill = isEditExisting || state.isCopiedOrder;

      const sysCols = ORDER_SYSTEM_KEYS.map(k => getOrderCfg(k)).filter(Boolean);

      const initDue = r.due_date || "";
      const leadText = formatLeadDaysText(initReceipt, initDue);

      return `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-end md:items-center justify-center z-40 overflow-y-auto">
          <form id="orderRecordForm" onsubmit="saveOrderRecord(event)" class="bg-white w-full max-w-2xl rounded-t-3xl md:rounded-3xl p-5 max-h-[92vh] overflow-y-auto space-y-4 shadow-2xl">

              <div>
                <div class="flex items-center gap-2">
                  <h2 class="font-extrabold text-lg text-slate-900">${isEditExisting ? "KOASIS 발주 내역 상세 / 수정" : "새 KOASIS 발주 등록"}</h2>
                  ${state.isCopiedOrder ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-amber-100 text-amber-800 border border-amber-300">📋 동일 스펙 복사 등록중</span>` : ""}
                </div>
                <p class="text-xs text-slate-500 mt-0.5"><span class="text-red-500 font-bold">*</span> 표시는 필수 입력 항목입니다</p>
              </div>
              <button type="button" onclick="state.modalOpen=false;state.isCopiedOrder=false;render()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none px-1">&times;</button>
            </div>

            ${isEditExisting ? `<div class="text-xs bg-slate-100 p-2.5 rounded-xl text-slate-600">생성일시: <b>${formatDateTime(r.created_at)}</b> (생성자: <b>${r.created_by || "-"}</b>) / 최종 편집: <b>${r.updated_by || "-"}</b>${r.updated_at && r.updated_by ? ` (${formatDateTime(r.updated_at)})` : ""}</div>` : ""}

            <div class="grid grid-cols-2 gap-3 text-sm">
              ${sysCols.map(c => {
                let val = r[c.field_key] ?? "";
                if (!hasPrefill && c.field_key === "receipt_date") val = today;
                if (!hasPrefill && c.field_key === "shipment_status") val = defaultFirstStatus;

                const fieldHtml = renderDynamicInput(c, val, ORDER_REQUIRED_KEYS.includes(c.field_key));
                if (c.field_key === "due_date") {
                  return fieldHtml + `
                    <div class="col-span-2 bg-indigo-50/80 border border-indigo-200/80 rounded-2xl px-3.5 py-2.5 flex justify-between items-center text-xs sm:text-sm">
                      <span class="font-bold text-indigo-900">⏱️ 소요 예정일 (접수일 ~ 납기일 자동 계산)</span>
                      <span id="modalLeadTimeDisplay" class="font-extrabold text-indigo-700 text-base">${leadText}</span>
                    </div>`;

            <div class="flex flex-wrap justify-between items-center gap-2 pt-3 border-t border-slate-200">
              <div class="flex items-center gap-1.5">
                ${isEditExisting ? `

                ` : ""}
              </div>
              <div class="flex gap-2 ml-auto">
                <button type="button" onclick="state.modalOpen=false;state.isCopiedOrder=false;render()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-bold">취소</button>

          </form>
        </div>`;

            <div class="flex justify-between items-center border-b border-slate-200 pb-2.5 sticky top-0 bg-white z-10">
              <h2 class="font-extrabold text-lg">${isOrder ? "KOASIS 발주 대장" : "AS 접수 대장"} 항목 및 옵션 관리</h2>
              <button onclick="state.configModalOpen=false;render()" class="text-2xl text-slate-400 hover:text-slate-700">&times;</button>
            </div>

            <form onsubmit="addNewField(event)" class="bg-emerald-50/80 p-3.5 rounded-2xl space-y-2 border border-emerald-200">
              <h3 class="font-extrabold text-emerald-900">+ 새 입력 항목 추가하기</h3>
              <div class="grid grid-cols-2 gap-2">
                <input id="newFieldLabel" placeholder="새 항목명 입력" class="border border-slate-300 rounded-xl px-2.5 py-2 bg-white" />
                <select id="newFieldType" onchange="document.getElementById('newFieldOpts').style.display=this.value==='select'?'block':'none'" class="border border-slate-300 rounded-xl px-2.5 py-2 bg-white">
                  <option value="select">선택형 (드롭다운)</option>
                  <option value="text">직접 입력 (텍스트)</option>
                </select>
              </div>
              <input id="newFieldOpts" placeholder="선택 옵션 입력 (쉼표로 구분: 옵션1, 옵션2)" class="w-full border border-slate-300 rounded-xl px-2.5 py-2 bg-white" />
              <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold">새 항목 추가</button>
            </form>

            ${customCols.length > 0 ? `
              <div class="space-y-2">
                <h3 class="font-bold text-slate-700">추가된 항목 설정</h3>
                ${customCols.map(renderConfigRow).join("")}
              </div>` : ""}

            <div class="space-y-2 border-t border-slate-200 pt-3">
              <h3 class="font-bold text-slate-700">기존 항목 입력 방식 전환 및 선택 목록 수정</h3>
              <p class="text-xs text-slate-500">각 항목의 방식을 [직접 입력] 또는 [선택형]으로 바꾼 뒤 '적용'을 누르세요.</p>
              <div class="space-y-2">
                ${sysCols.map(renderConfigRow).join("")}
              </div>
            </div>
          </div>
        </div>`;
    }

    init();
  </script>
</body>
</html>
