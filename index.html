    let state = {
      activeTab: "as", // "as" | "order"

      // AS 접수 대장
      records: [],
      configs: [],
      search: "",
      statusFilter: "전체",
      modelFilter: "전체",
      visitorFilter: "전체",
      dateFrom: "",
      dateTo: "",
      // KOASIS 발주 대장
      orderRecords: [],

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.classList.remove("opacity-0");
      el.classList.add("opacity-100");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        el.classList.remove("opacity-100");
        el.classList.add("opacity-0");
      }, 2400);
    }

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatMoney(n) {
      const num = Number(n) || 0;
      return num.toLocaleString("ko-KR");
    }

    function calcAsBilling(billingType, repairFee, partsFee) {
      const r = Number(repairFee) || 0;
      const p = Number(partsFee) || 0;
      const supply = r + p;
      if (billingType === "무상") {
        return { supply: 0, vat: 0, total: 0 };
      }
      if (billingType === "세금계산서") {
        const vat = Math.round(supply * 0.1);
        return { supply, vat, total: supply + vat };
      }
      // 현금 또는 기본
      return { supply, vat: 0, total: supply };
    }

    function calcLeadTime(receiptDate, dueDate) {
      if (!receiptDate || !dueDate) return "-";
      const d1 = new Date(receiptDate + "T00:00:00");
      const d2 = new Date(dueDate + "T00:00:00");
      if (isNaN(d1) || isNaN(d2)) return "-";
      const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
      return diff >= 0 ? `${diff}일` : `${diff}일`;
    }

    function calcDdayBadge(dueDate, status) {
      if (!dueDate || status === "출고완료") return "";
      const today = new Date(todayStr() + "T00:00:00");
      const due = new Date(dueDate + "T00:00:00");
      if (isNaN(due)) return "";
      const diff = Math.round((due - today) / (1000 * 60 * 60 * 24));
      if (diff < 0) return `<span class="ml-1 px-1.5 py-0.5 text-[10px] font-bold rounded bg-red-100 text-red-700">D+${Math.abs(diff)} 지연</span>`;
      if (diff === 0) return `<span class="ml-1 px-1.5 py-0.5 text-[10px] font-bold rounded bg-orange-100 text-orange-700">오늘납기</span>`;
      if (diff <= 3) return `<span class="ml-1 px-1.5 py-0.5 text-[10px] font-bold rounded bg-amber-100 text-amber-700">D-${diff}</span>`;
      return `<span class="ml-1 px-1.5 py-0.5 text-[10px] font-medium rounded bg-gray-100 text-gray-600">D-${diff}</span>`;
    }

    async function copyText(text, label = "내용") {
      if (!text) {
        showToast(`복사할 ${label}이(가) 없습니다.`);
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast(`${label} 복사 완료!`);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(`${label} 복사 완료!`);
      }
    }

    // ==========================================
    // 인증 및 데이터 로드
    // ==========================================
    function toEmail(idInput) {
      const clean = idInput.trim();
      return clean.includes("@") ? clean : `${clean}@koasis.local`;
    }

    function toUsername(email) {
      if (!email) return "";
      return email.endsWith("@koasis.local") ? email.replace("@koasis.local", "") : email;
    }

    async function initAuth() {
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) {
        state.user = session.user;
        state.username = toUsername(session.user.email);
        await loadAllData();
        setupRealtime();
      }
      state.loading = false;
      render();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const idVal = document.getElementById("loginId").value.trim();
      const pwVal = document.getElementById("loginPw").value.trim();
      const remember = document.getElementById("loginRemember").checked;
      if (!idVal || !pwVal) {
        showToast("아이디와 비밀번호를 입력해 주세요.");
        return;
      }
      const email = toEmail(idVal);
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pwVal });
      if (error) {
        alert("로그인 실패: " + error.message);
        return;
      }
      if (remember) {
        localStorage.setItem(SAVED_CREDS_KEY, JSON.stringify({ id: idVal, pw: pwVal }));
      } else {
        localStorage.removeItem(SAVED_CREDS_KEY);
      }
      state.user = data.user;
      state.username = toUsername(data.user.email);
      await loadAllData();
      setupRealtime();
      render();
      showToast(`${state.username}님 환영합니다!`);
    }

    async function handleLogout() {
      if (realtimeChannel) {
        sb.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }
      await sb.auth.signOut();
      state.user = null;
      state.username = "";
      render();
    }

    async function loadAllData() {
      await Promise.all([
        loadAsConfigs(),
        loadAsRecords(),
        loadOrderConfigs(),
        loadOrderRecords()
      ]);
    }

    async function loadAsConfigs() {
      const { data, error } = await sb.from("field_configs").select("*").order("sort_order", { ascending: true });
      if (!error && data && data.length > 0) {
        state.configs = data.map(c => ({
          ...c,
          field_label: c.field_key === "repair_fee" && c.field_label === "수리비" ? "출장비" : c.field_label,
          options: Array.isArray(c.options) ? c.options : []
        }));
      } else {
        state.configs = JSON.parse(JSON.stringify(DEFAULT_AS_CONFIGS));
      }
    }

    async function loadAsRecords() {
      const { data, error } = await sb.from("as_records").select("*").order("created_at", { ascending: false });
      if (!error && data) {
        state.records = data;
      }
    }

    async function loadOrderConfigs() {
      const { data, error } = await sb.from("order_field_configs").select("*").order("sort_order", { ascending: true });
      if (!error && data && data.length > 0) {
        state.orderConfigs = data.map(c => ({
          ...c,
          options: Array.isArray(c.options) ? c.options : []
        }));
      } else {
        state.orderConfigs = JSON.parse(JSON.stringify(DEFAULT_ORDER_CONFIGS));
      }
    }

    async function loadOrderRecords() {
      const { data, error } = await sb.from("order_records").select("*").order("created_at", { ascending: false });
      if (!error && data) {
        state.orderRecords = data;
      }
    }

    function setupRealtime() {
      if (realtimeChannel) sb.removeChannel(realtimeChannel);
      realtimeChannel = sb.channel("koasis-realtime-all")
        .on("postgres_changes", { event: "*", schema: "public", table: "as_records" }, async () => {
          await loadAsRecords();
          render();
        })
        .on("postgres_changes", { event: "*", schema: "public", table: "field_configs" }, async () => {
          await loadAsConfigs();
          render();
        })
        .on("postgres_changes", { event: "*", schema: "public", table: "order_records" }, async () => {
          await loadOrderRecords();
          render();
        })
        .on("postgres_changes", { event: "*", schema: "public", table: "order_field_configs" }, async () => {
          await loadOrderConfigs();
          render();
        })
        .subscribe();
    }

    async function manualRefresh() {
      await loadAllData();
      render();
      showToast("최신 데이터로 동기화되었습니다.");
    }

    // ==========================================
    // AS 접수 대장 CRUD
    // ==========================================
    function openAsModal(record = null) {
      if (record) {
        state.editingAsId = record.id;
        state.asForm = {
          client_name: record.client_name || "",
          status: record.status || "접수",
          receipt_date: record.receipt_date || "",
          visit_date: record.visit_date || "",
          visitor: record.visitor || "",
          model_name: record.model_name || "",
          symptom: record.symptom || "",
          action_taken: record.action_taken || "",
          address: record.address || "",
          phone: record.phone || "",
          billing_type: record.billing_type || "무상",
          repair_fee: record.repair_fee || 0,
          parts_fee: record.parts_fee || 0,
          remarks: record.remarks || "",
          custom_fields: { ...(record.custom_fields || {}) }
        };
      } else {
        state.editingAsId = null;
        state.asForm = {
          client_name: "",
          status: "접수",
          receipt_date: todayStr(),
          visit_date: "",
          visitor: "",
          model_name: "",
          symptom: "",
          action_taken: "",
          address: "",
          phone: "",
          billing_type: "무상",
          repair_fee: 0,
          parts_fee: 0,
          remarks: "",
          custom_fields: {}
        };
      }
      state.showAsModal = true;
      render();
    }

    function updateAsFormField(key, value, isCustom = false) {
      if (isCustom) {
        state.asForm.custom_fields[key] = value;
      } else {
        state.asForm[key] = value;
      }
      if (key === "billing_type" || key === "repair_fee" || key === "parts_fee") {
        render();
      }
    }

    async function saveAsRecord(e) {
      e.preventDefault();
      const f = state.asForm;
      if (!f.client_name || !f.client_name.trim()) {
        showToast("업체/농가명을 입력해 주세요.");
        return;
      }
      const bill = calcAsBilling(f.billing_type, f.repair_fee, f.parts_fee);
      const payload = {
        client_name: f.client_name.trim(),
        status: f.status || "접수",
        receipt_date: f.receipt_date || null,
        visit_date: f.visit_date || null,
        visitor: f.visitor || "",
        model_name: f.model_name || "",
        symptom: f.symptom || "",
        action_taken: f.action_taken || "",
        address: f.address || "",
        phone: f.phone || "",
        billing_type: f.billing_type || "무상",
        repair_fee: Number(f.repair_fee) || 0,
        parts_fee: Number(f.parts_fee) || 0,
        vat_amount: bill.vat,
        total_amount: bill.total,
        remarks: f.remarks || "",
        custom_fields: f.custom_fields || {},
        updated_by: state.username
      };

      if (state.editingAsId) {
        const { error } = await sb.from("as_records").update(payload).eq("id", state.editingAsId);
        if (error) { alert("수정 실패: " + error.message); return; }
        showToast("AS 내역이 수정되었습니다.");
      } else {
        payload.created_by = state.username;
        const { error } = await sb.from("as_records").insert([payload]);
        if (error) { alert("등록 실패: " + error.message); return; }
        showToast("새 AS 건이 등록되었습니다.");
      }
      state.showAsModal = false;
      await loadAsRecords();
      render();
    }

    async function deleteAsRecord() {
      if (!state.editingAsId) return;
      if (!confirm("이 AS 내역을 정말 삭제하시겠습니까?")) return;
      const { error } = await sb.from("as_records").delete().eq("id", state.editingAsId);
      if (error) { alert("삭제 실패: " + error.message); return; }
      state.showAsModal = false;
      await loadAsRecords();
      render();
      showToast("삭제되었습니다.");
    }

    function duplicateCurrentOrder() {
      state.editingOrderId = null;
      state.orderForm.serial_number = "";
      state.orderForm.shipment_status = "발주접수";
      render();
      showToast("동일 스펙이 복사되었습니다. 기대번호 입력 후 저장하세요.");
    }

    function toggleOrderOption(opt) {
      const currentRaw = state.orderForm.option_add || "";
      let selected = currentRaw.split(",").map(s => s.trim()).filter(Boolean);

      if (opt === "없음") {
        if (selected.includes("없음")) {
          selected = [];
        } else {
          selected = ["없음"];
        }
      } else {
        selected = selected.filter(item => item !== "없음");
        if (selected.includes(opt)) {
          selected = selected.filter(item => item !== opt);
        } else {
          selected.push(opt);
        }
      }
      state.orderForm.option_add = selected.join(", ");
      render();
    }

    function updateOrderFormField(key, value, isCustom = false) {
      if (isCustom) {
        state.orderForm.custom_fields[key] = value;
      } else {
        state.orderForm[key] = value;
      }
      if (key === "receipt_date" || key === "due_date") {
        render();
      }
    }

    async function saveOrderRecord(e) {
      e.preventDefault();
      const f = state.orderForm;
      if (!f.client_name || !f.client_name.trim()) {
        showToast("발주처를 입력해 주세요.");
        return;
      }
      const payload = {
        client_name: f.client_name.trim(),
        shipment_status: f.shipment_status || "발주접수",
        receipt_date: f.receipt_date || null,
        due_date: f.due_date || null,
        model_name: f.model_name || "",
        orderer: f.orderer || "",
        pump_change: f.pump_change || "",
        option_add: f.option_add || "",
        serial_number: f.serial_number || "",
        dest_type: f.dest_type || "",
        dest_address: f.dest_address || "",
        dest_phone: f.dest_phone || "",
        remarks: f.remarks || "",
        custom_fields: f.custom_fields || {},
        updated_by: state.username
      };

      if (state.editingOrderId) {
        const { error } = await sb.from("order_records").update(payload).eq("id", state.editingOrderId);
        if (error) { alert("발주 수정 실패: " + error.message); return; }
        showToast("발주 내역이 수정되었습니다.");
      } else {
        payload.created_by = state.username;
        const { error } = await sb.from("order_records").insert([payload]);
        if (error) { alert("발주 등록 실패: " + error.message); return; }
        showToast("새 발주 건이 등록되었습니다.");
      }
      state.showOrderModal = false;
      await loadOrderRecords();
      render();
    }

    async function deleteOrderRecord() {
      if (!state.editingOrderId) return;
      if (!confirm("이 발주 내역을 정말 삭제하시겠습니까?")) return;
      const { error } = await sb.from("order_records").delete().eq("id", state.editingOrderId);
      if (error) { alert("삭제 실패: " + error.message); return; }
      state.showOrderModal = false;
      await loadOrderRecords();
      render();
      showToast("삭제되었습니다.");
    }

    // ==========================================
    // 항목 관리 (AS / 발주 공통)
    // ==========================================
    async function addCustomField() {
      const label = state.newFieldLabel.trim();
      const type = state.newFieldType;
      const opts = state.newFieldOptions.split(",").map(s => s.trim()).filter(Boolean);
      if (!label) {
        showToast("항목 이름을 입력해 주세요.");
        return;
      }
      const isOrder = state.activeTab === "order";
      const table = isOrder ? "order_field_configs" : "field_configs";
      const currentList = isOrder ? state.orderConfigs : state.configs;
      const fieldKey = "custom_" + Date.now();
      const sortOrder = currentList.length + 1;

      const { error } = await sb.from(table).insert([{
        field_key: fieldKey,
        field_label: label,
        field_type: type,
        options: type === "select" ? opts : [],
        is_system: false,
        sort_order: sortOrder
      }]);

      if (error) {
        alert("항목 추가 실패: " + error.message);
        return;
      }
      state.newFieldLabel = "";
      state.newFieldType = "text";
      state.newFieldOptions = "";
      if (isOrder) await loadOrderConfigs();
      else await loadAsConfigs();
      render();
      showToast(`'${label}' 항목이 추가되었습니다.`);
    }

    async function updateConfigItem(id, idx) {
      const isOrder = state.activeTab === "order";
      const table = isOrder ? "order_field_configs" : "field_configs";
      const labelEl = document.getElementById(`cfg_label_${idx}`);
      const typeEl = document.getElementById(`cfg_type_${idx}`);
      const optsEl = document.getElementById(`cfg_opts_${idx}`);

      const newLabel = labelEl ? labelEl.value.trim() : "";
      const newType = typeEl ? typeEl.value : "text";
      const newOpts = optsEl ? optsEl.value.split(",").map(s => s.trim()).filter(Boolean) : [];

      if (!newLabel) {
        showToast("항목명을 입력해 주세요.");
        return;
      }

      const { error } = await sb.from(table).update({
        field_label: newLabel,
        field_type: newType,
        options: newType === "select" ? newOpts : []
      }).eq("id", id);

      if (error) {
        alert("항목 수정 실패: " + error.message);
        return;
      }
      if (isOrder) await loadOrderConfigs();
      else await loadAsConfigs();
      render();
      showToast(`'${newLabel}' 설정이 저장되었습니다.`);
    }

    async function deleteConfigItem(id, label) {
      if (!confirm(`'${label}' 항목을 삭제하시겠습니까?`)) return;
      const isOrder = state.activeTab === "order";
      const table = isOrder ? "order_field_configs" : "field_configs";
      const { error } = await sb.from(table).delete().eq("id", id);
      if (error) {
        alert("삭제 실패: " + error.message);
        return;
      }
      if (isOrder) await loadOrderConfigs();
      else await loadAsConfigs();
      render();
      showToast("항목이 삭제되었습니다.");
    }

    // ==========================================
    // 필터링 및 구버전 호환 엑셀(.xls) 다운로드
    // ==========================================
    function getFilteredAsRecords() {
      return state.records.filter(r => {
        if (state.statusFilter !== "전체" && r.status !== state.statusFilter) return false;
        if (state.modelFilter !== "전체" && r.model_name !== state.modelFilter) return false;
        if (state.visitorFilter !== "전체" && r.visitor !== state.visitorFilter) return false;
        if (state.dateFrom && (!r.receipt_date || r.receipt_date < state.dateFrom)) return false;
        if (state.dateTo && (!r.receipt_date || r.receipt_date > state.dateTo)) return false;
        if (state.search.trim()) {
          const q = state.search.trim().toLowerCase();
          const hay = [
            r.client_name, r.status, r.visitor, r.model_name,
            r.symptom, r.action_taken, r.address, r.phone, r.remarks,
            ...Object.values(r.custom_fields || {})
          ].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function getFilteredOrderRecords() {
      return state.orderRecords.filter(r => {
        if (state.orderStatusFilter !== "전체" && r.shipment_status !== state.orderStatusFilter) return false;
        if (state.orderModelFilter !== "전체" && r.model_name !== state.orderModelFilter) return false;
        if (state.orderOrdererFilter !== "전체" && r.orderer !== state.orderOrdererFilter) return false;
        if (state.orderDateFrom && (!r.receipt_date || r.receipt_date < state.orderDateFrom)) return false;
        if (state.orderDateTo && (!r.receipt_date || r.receipt_date > state.orderDateTo)) return false;
        if (state.orderSearch.trim()) {
          const q = state.orderSearch.trim().toLowerCase();
          const hay = [
            r.client_name, r.shipment_status, r.model_name, r.orderer,
            r.pump_change, r.option_add, r.serial_number,
            r.dest_type, r.dest_address, r.dest_phone, r.remarks,
            ...Object.values(r.custom_fields || {})
          ].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function exportExcel() {
      if (state.activeTab === "as") {
        const list = getFilteredAsRecords();
        if (list.length === 0) { showToast("내보낼 AS 데이터가 없습니다."); return; }
        const customCols = state.configs.filter(c => !c.is_system);
        const rows = list.map((r, i) => {
          const bill = calcAsBilling(r.billing_type, r.repair_fee, r.parts_fee);
          const row = {
            "No": list.length - i,
            "업체/농가명": r.client_name || "",
            "진행상태": r.status || "",
            "접수일": r.receipt_date || "",
            "방문일": r.visit_date || "",
            "담당자": r.visitor || "",
            "모델명": r.model_name || "",
            "고장증상": r.symptom || "",
            "조치내용": r.action_taken || "",
            "주소": r.address || "",
            "연락처": r.phone || "",
            "청구구분": r.billing_type || "",
            "출장비": Number(r.repair_fee) || 0,
            "부품비": Number(r.parts_fee) || 0,
            "부가세(10%)": bill.vat,
            "합계금액": bill.total,
            "비고": r.remarks || ""
          };
          customCols.forEach(c => {
            row[c.field_label] = (r.custom_fields && r.custom_fields[c.field_key]) || "";
          });
          return row;
        });
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "AS접수대장");
        XLSX.writeFile(wb, `KOASIS_AS접수대장_${todayStr()}.xls`, { bookType: "biff8" });
      } else {
        const list = getFilteredOrderRecords();
        if (list.length === 0) { showToast("내보낼 발주 데이터가 없습니다."); return; }
        const customCols = state.orderConfigs.filter(c => !c.is_system);
        const rows = list.map((r, i) => {
          const row = {
            "No": list.length - i,
            "발주처": r.client_name || "",
            "출고 현황": r.shipment_status || "",
            "접수일": r.receipt_date || "",
            "납기일": r.due_date || "",
            "소요 예정일": calcLeadTime(r.receipt_date, r.due_date),
            "모델명": r.model_name || "",
            "발주자": r.orderer || "",
            "펌프 변경": r.pump_change || "",
            "옵션 추가": r.option_add || "",
            "기대번호": r.serial_number || "",
            "출고지 유형": r.dest_type || "",
            "출고지 주소": r.dest_address || "",
            "출고지 전화번호": r.dest_phone || "",
            "비고": r.remarks || ""
          };
          customCols.forEach(c => {
            row[c.field_label] = (r.custom_fields && r.custom_fields[c.field_key]) || "";
          });
          return row;
        });
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "KOASIS발주대장");
        XLSX.writeFile(wb, `KOASIS_발주대장_${todayStr()}.xls`, { bookType: "biff8" });
      }
      showToast("엑셀(.xls) 파일이 다운로드되었습니다.");
    }

              </div>

              <div class="pt-2 flex items-center justify-between gap-2 border-t border-gray-200">
                ${state.editingAsId ? `<button type="button" onclick="deleteAsRecord()" class="px-3.5 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl text-xs">삭제</button>` : `<div></div>`}
                <div class="flex gap-2">
                  <button type="button" onclick="state.showAsModal=false; render();" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs">취소</button>
                  <button type="submit" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow">저장하기</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderOrderModal() {
      if (!state.showOrderModal) return "";
      const f = state.orderForm;
      const customCols = state.orderConfigs.filter(c => !c.is_system);

      const getCfg = (key) => state.orderConfigs.find(c => c.field_key === key) || { field_label: key, options: [] };
      const statusCfg = getCfg("shipment_status");
      const modelCfg = getCfg("model_name");
      const ordererCfg = getCfg("orderer");
      const pumpCfg = getCfg("pump_change");
      const optionCfg = getCfg("option_add");
      const destTypeCfg = getCfg("dest_type");

      const selectedOptions = (f.option_add || "").split(",").map(s => s.trim()).filter(Boolean);
      const leadTimeText = calcLeadTime(f.receipt_date, f.due_date);

      return `
        <div class="fixed inset-0 bg-black/50 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-white w-full sm:max-w-xl max-h-[92vh] rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="px-5 py-3.5 border-b border-gray-200 flex items-center justify-between bg-indigo-50/70">
              <div class="flex items-center gap-2">
                <h2 class="font-bold text-base text-gray-900">${state.editingOrderId ? "KOASIS 발주 내역 수정" : "새 KOASIS 발주 등록"}</h2>
                ${!state.editingOrderId && f.client_name ? `<span class="px-2 py-0.5 bg-indigo-600 text-white text-[10px] font-bold rounded-full">복사 등록중</span>` : ""}
              </div>
              <button type="button" onclick="state.showOrderModal=false; render();" class="text-gray-400 hover:text-gray-700 text-xl font-bold px-2">&times;</button>
            </div>
            <form onsubmit="saveOrderRecord(event)" class="p-5 overflow-y-auto space-y-3.5 text-sm">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(getCfg("client_name").field_label)} *</label>
                  <input type="text" value="${escapeHtml(f.client_name)}" oninput="updateOrderFormField('client_name', this.value)" class="w-full px-3 py-2 border border-gray-300 rounded-lg" required />
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(statusCfg.field_label)}</label>
                  <select onchange="updateOrderFormField('shipment_status', this.value)" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white">
                    ${statusCfg.options.map(o => `<option value="${escapeHtml(o)}" ${f.shipment_status === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-2.5 items-end">
                <div>
                  <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(getCfg("receipt_date").field_label)}</label>
                  <input type="date" value="${escapeHtml(f.receipt_date)}" onchange="updateOrderFormField('receipt_date', this.value)" class="w-full px-2.5 py-2 border border-gray-300 rounded-lg text-xs" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(getCfg("due_date").field_label)}</label>
                  <input type="date" value="${escapeHtml(f.due_date)}" onchange="updateOrderFormField('due_date', this.value)" class="w-full px-2.5 py-2 border border-gray-300 rounded-lg text-xs" />
                </div>
                <div class="p-2 bg-indigo-50 border border-indigo-100 rounded-lg text-center">
                  <div class="text-[10px] text-indigo-600 font-semibold">소요 예정일</div>
                  <div class="text-xs font-extrabold text-indigo-900">${leadTimeText}</div>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(modelCfg.field_label)}</label>
                  <select onchange="updateOrderFormField('model_name', this.value)" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white">
                    <option value="">선택</option>
                    ${modelCfg.options.map(o => `<option value="${escapeHtml(o)}" ${f.model_name === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(ordererCfg.field_label)}</label>
                  <select onchange="updateOrderFormField('orderer', this.value)" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white">
                    <option value="">선택</option>
                    ${ordererCfg.options.map(o => `<option value="${escapeHtml(o)}" ${f.orderer === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(pumpCfg.field_label)}</label>
                  <select onchange="updateOrderFormField('pump_change', this.value)" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white">
                    <option value="">선택</option>
                    ${pumpCfg.options.map(o => `<option value="${escapeHtml(o)}" ${f.pump_change === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(getCfg("serial_number").field_label)}</label>
                  <input type="text" value="${escapeHtml(f.serial_number)}" oninput="updateOrderFormField('serial_number', this.value)" placeholder="기대번호 입력" class="w-full px-3 py-2 border border-gray-300 rounded-lg font-mono" />
                </div>
              </div>

              <!-- 옵션 추가 (다중 선택 태그 버튼) -->
              <div class="p-3 bg-emerald-50/60 border border-emerald-200 rounded-xl">
                <div class="flex items-center justify-between mb-2">
                  <label class="text-xs font-bold text-gray-800">${escapeHtml(optionCfg.field_label)} <span class="text-[11px] font-normal text-emerald-700">(중복 선택 가능)</span></label>
                  ${selectedOptions.length > 0 ? `<span class="text-[11px] font-bold text-emerald-800">${selectedOptions.length}개 선택됨</span>` : ""}
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${optionCfg.options.map(opt => {
                    const isChecked = selectedOptions.includes(opt);
                    return `
                      <button type="button" onclick="toggleOrderOption('${escapeHtml(opt)}')"
                        class="px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                          isChecked
                            ? "bg-emerald-600 text-white border-emerald-600 shadow-sm"
                            : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                        }">
                        ${isChecked ? "✓ " : ""}${escapeHtml(opt)}
                      </button>
                    `;
                  }).join("")}
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <div>
                  <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(destTypeCfg.field_label)}</label>
                  <select onchange="updateOrderFormField('dest_type', this.value)" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white text-xs">
                    <option value="">선택</option>
                    ${destTypeCfg.options.map(o => `<option value="${escapeHtml(o)}" ${f.dest_type === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
                  </select>
                </div>
                <div class="sm:col-span-2">
                  <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(getCfg("dest_phone").field_label)}</label>
                  <input type="text" value="${escapeHtml(f.dest_phone)}" oninput="updateOrderFormField('dest_phone', this.value)" placeholder="연락처 입력" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(getCfg("dest_address").field_label)}</label>
                <div class="flex gap-1.5">
                  <input type="text" value="${escapeHtml(f.dest_address)}" oninput="updateOrderFormField('dest_address', this.value)" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg" />
                  <button type="button" onclick="copyText(state.orderForm.dest_address, '출고지 주소')" class="px-3 py-2 bg-blue-50 text-blue-700 font-bold rounded-lg text-xs shrink-0">복사</button>
                </div>
              </div>

              ${customCols.map(c => {
                const val = (f.custom_fields && f.custom_fields[c.field_key]) || "";
                if (c.field_type === "select") {
                  return `
                    <div>
                      <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(c.field_label)}</label>
                      <select onchange="updateOrderFormField('${c.field_key}', this.value, true)" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white">
                        <option value="">선택</option>
                        ${c.options.map(o => `<option value="${escapeHtml(o)}" ${val === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
                      </select>
                    </div>
                  `;
                }
                return `
                  <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(c.field_label)}</label>
                    <input type="${c.field_type === 'date' ? 'date' : c.field_type === 'number' ? 'number' : 'text'}" value="${escapeHtml(val)}" oninput="updateOrderFormField('${c.field_key}', this.value, true)" class="w-full px-3 py-2 border border-gray-300 rounded-lg" />
                  </div>
                `;
              }).join("")}

              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">${escapeHtml(getCfg("remarks").field_label)}</label>
                <textarea rows="2" oninput="updateOrderFormField('remarks', this.value)" class="w-full px-3 py-2 border border-gray-300 rounded-lg">${escapeHtml(f.remarks)}</textarea>
              </div>

              <div class="pt-2.5 flex flex-wrap items-center justify-between gap-2 border-t border-gray-200">
                <div class="flex items-center gap-1.5">
                  ${state.editingOrderId ? `
                    <button type="button" onclick="deleteOrderRecord()" class="px-3 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl text-xs">삭제</button>
                    <button type="button" onclick="duplicateCurrentOrder()" class="px-3 py-2.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 font-bold rounded-xl text-xs">📋 동일 스펙 복사 등록</button>
                  ` : ""}
                </div>
                <div class="flex gap-2 ml-auto">
                  <button type="button" onclick="state.showOrderModal=false; render();" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs">취소</button>
                  <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow">저장하기</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderConfigModal() {
      if (!state.showConfigModal) return "";
      const isOrder = state.activeTab === "order";
      const list = isOrder ? state.orderConfigs : state.configs;

      return `
        <div class="fixed inset-0 bg-black/50 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-white w-full sm:max-w-2xl max-h-[90vh] rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="px-5 py-3.5 border-b border-gray-200 flex items-center justify-between bg-gray-50">
              <h2 class="font-bold text-base text-gray-900">⚙️ ${isOrder ? "KOASIS 발주 대장" : "AS 접수 대장"} 항목 및 드롭다운 관리</h2>
              <button type="button" onclick="state.showConfigModal=false; render();" class="text-gray-400 hover:text-gray-700 text-xl font-bold px-2">&times;</button>
            </div>

            <div class="p-5 overflow-y-auto space-y-4 text-xs">
              <!-- 새 항목 추가 -->
              <div class="p-3.5 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2.5">
                <div class="font-bold text-emerald-900">+ 새 사용자 정의 항목 추가</div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <input type="text" value="${escapeHtml(state.newFieldLabel)}" oninput="state.newFieldLabel=this.value" placeholder="항목 이름 (예: 특이사항)" class="px-3 py-2 border border-gray-300 rounded-lg bg-white" />
                  <select onchange="state.newFieldType=this.value; render();" class="px-3 py-2 border border-gray-300 rounded-lg bg-white">
                    <option value="text" ${state.newFieldType === "text" ? "selected" : ""}>텍스트 입력</option>
                    <option value="select" ${state.newFieldType === "select" ? "selected" : ""}>선택형(드롭다운)</option>
                    <option value="date" ${state.newFieldType === "date" ? "selected" : ""}>날짜</option>
                    <option value="number" ${state.newFieldType === "number" ? "selected" : ""}>숫자</option>
                  </select>
                  <button type="button" onclick="addCustomField()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg">새 항목 추가</button>
                </div>
                ${state.newFieldType === "select" ? `
                  <input type="text" value="${escapeHtml(state.newFieldOptions)}" oninput="state.newFieldOptions=this.value" placeholder="선택지 입력 (쉼표로 구분: 옵션1, 옵션2, 옵션3)" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white" />
                ` : ""}
              </div>

              <!-- 기존 항목 설정 목록 -->
              <div class="space-y-2">
                <div class="font-bold text-gray-700">기존 항목 이름 및 드롭다운 선택지 수정 (쉼표 <code>,</code> 로 구분)</div>
                ${list.map((c, idx) => `
                  <div class="p-3 border border-gray-200 rounded-xl bg-gray-50/60 space-y-2">
                    <div class="flex flex-wrap items-center gap-2">
                      <input id="cfg_label_${idx}" type="text" value="${escapeHtml(c.field_label)}" class="w-32 sm:w-40 px-2.5 py-1.5 border border-gray-300 rounded-lg bg-white font-bold" />
                      <select id="cfg_type_${idx}" class="px-2.5 py-1.5 border border-gray-300 rounded-lg bg-white" ${c.is_system ? "disabled" : ""}>
                        <option value="text" ${c.field_type === "text" ? "selected" : ""}>텍스트</option>
                        <option value="select" ${c.field_type === "select" ? "selected" : ""}>선택형</option>
                        <option value="date" ${c.field_type === "date" ? "selected" : ""}>날짜</option>
                        <option value="number" ${c.field_type === "number" ? "selected" : ""}>숫자</option>
                        <option value="textarea" ${c.field_type === "textarea" ? "selected" : ""}>장문</option>
                      </select>
                      ${c.id ? `
                        <button type="button" onclick="updateConfigItem('${c.id}', ${idx})" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg">적용</button>
                        ${!c.is_system ? `<button type="button" onclick="deleteConfigItem('${c.id}', '${escapeHtml(c.field_label)}')" class="px-2.5 py-1.5 bg-red-50 text-red-600 font-bold rounded-lg">삭제</button>` : ""}
                      ` : `<span class="text-[11px] text-amber-600 font-semibold">기본 설정</span>`}
                    </div>
                    ${c.field_type === "select" ? `
                      <input id="cfg_opts_${idx}" type="text" value="${escapeHtml((c.options || []).join(", "))}" placeholder="선택지를 쉼표(,)로 구분하여 입력" class="w-full px-2.5 py-1.5 border border-gray-300 rounded-lg bg-white text-gray-700" />
                    ` : ""}
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById("app");
      if (state.loading) {
        app.innerHTML = `<div class="min-h-screen flex items-center justify-center text-sm font-bold text-gray-500">데이터 불러오는 중...</div>`;
        return;
      }
      if (!state.user) {
        app.innerHTML = renderLoginScreen();
        return;
      }

      const isAs = state.activeTab === "as";
      app.innerHTML = `
        <div class="min-h-screen pb-24">
          <!-- 상단 헤더 & 탭 -->
          <header class="bg-slate-900 text-white sticky top-0 z-30 shadow">
            <div class="max-w-7xl mx-auto px-3 sm:px-5 pt-3 pb-2">
              <div class="flex items-center justify-between gap-2 mb-2.5">
                <div class="flex items-center gap-2">
                  <span class="w-7 h-7 rounded-lg bg-emerald-500 text-slate-950 font-black flex items-center justify-center text-sm">K</span>
                  <h1 class="font-extrabold text-base sm:text-lg tracking-tight">KOASIS 통합 관리 대장</h1>
                </div>
                <div class="flex items-center gap-1.5 text-xs">
                  <span class="hidden sm:inline text-slate-300 mr-1">${escapeHtml(state.username)}님</span>
                  <button onclick="manualRefresh()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg font-medium">🔄 새로고침</button>
                  <button onclick="handleLogout()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-red-900/60 text-slate-300 rounded-lg">로그아웃</button>
                </div>
              </div>

              <!-- 탭 전환 & 우측 액션 버튼 -->
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex gap-1.5">
                  <button onclick="state.activeTab='as'; render();" class="px-3.5 py-2 rounded-t-lg text-xs sm:text-sm font-extrabold transition ${isAs ? "bg-gray-100 text-emerald-700" : "bg-slate-800 text-slate-300 hover:bg-slate-700"}">
                    🛠️ AS 접수 대장
                  </button>
                  <button onclick="state.activeTab='order'; render();" class="px-3.5 py-2 rounded-t-lg text-xs sm:text-sm font-extrabold transition ${!isAs ? "bg-gray-100 text-indigo-700" : "bg-slate-800 text-slate-300 hover:bg-slate-700"}">
                    📦 KOASIS 발주 대장
                  </button>
                </div>

                <div class="flex items-center gap-1.5 pb-1">
                  <button onclick="state.showConfigModal=true; render();" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-bold">⚙️ 항목관리</button>
                  <button onclick="exportExcel()" class="px-2.5 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white rounded-lg text-xs font-bold">📥 엑셀(.xls)</button>
                  <button onclick="${isAs ? "openAsModal()" : "openOrderModal()"}" class="px-3 py-1.5 ${isAs ? "bg-emerald-500 hover:bg-emerald-400 text-slate-950" : "bg-indigo-500 hover:bg-indigo-400 text-white"} rounded-lg text-xs font-extrabold shadow">
                    + ${isAs ? "새 AS 등록" : "새 발주 등록"}
                  </button>
                </div>
              </div>
            </div>
          </header>

          <!-- 메인 본문 -->
          <main class="max-w-7xl mx-auto px-3 sm:px-5 pt-4">
            ${isAs ? renderAsTab() : renderOrderTab()}
          </main>
        </div>

        ${renderAsModal()}
        ${renderOrderModal()}
        ${renderConfigModal()}
      `;
    }

    initAuth();
  </script>
</body>
</html>
